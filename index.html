<style>
:root{

*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}

.topActions{justify-self:end;display:flex;align-items:center;gap:5px;padding-right:8px}
.iconBtn{width:32px;height:32px;padding:0;border:1px solid transparent;background:transparent;display:grid;place-items:center;border-radius:7px;cursor:pointer;color:#909090}.iconBtn:hover,.iconBtn:focus-visible{border-color:var(--line2);background:var(--hover);color:#f2f2f2;outline:none}.iconBtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.pages{display:grid;gap:8px}.pageBlock{width:54px;height:54px;border:1px solid var(--line);background:#000;border-radius:8px;display:grid;grid-template-rows:auto 1fr;align-content:center;text-align:left;padding:7px;cursor:pointer;overflow:hidden;color:#8d8d8d;transition:.12s}.pageBlock:hover{border-color:#4a4a4a;background:#171717;color:#dddddd}.pageBlock.active{background:var(--active);border-color:var(--active);color:var(--activeInk)}.pageNo{font:800 8px/1 var(--mono);opacity:.64}.pageLabel{align-self:end;font:700 9px/1.15 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.pageAdd{display:flex;justify-content:center;align-items:center;padding:0;font-size:24px;font-weight:200;line-height:1;color:var(--active);border-style:dashed}.pageAdd:hover{color:var(--active)}

.preview{position:absolute;inset:0;overflow:auto;padding:clamp(22px,4vw,62px) clamp(24px,7vw,108px) 90px;font:400 clamp(15px,1.35vw,19px)/1.72 system-ui,sans-serif;color:#e5e5e5}.preview[hidden]{display:none}.preview h1,.preview h2,.preview h3{font-family:var(--mono);letter-spacing:-.04em;margin:1.3em 0 .55em}.preview h1{font-size:2em}.preview h2{font-size:1.45em}.preview h3{font-size:1.16em}.preview p{margin:.7em 0}.preview code,.preview pre{font-family:var(--mono);background:#111111;border:1px solid var(--line)}.preview code{padding:.08em .35em;border-radius:4px}.preview pre{padding:14px;overflow:auto;border-radius:6px}.preview pre code{border:0;padding:0;background:transparent}.preview blockquote{margin:1em 0;padding-left:15px;border-left:2px solid #555;color:#b3b3b3}.preview a{color:#d0d0d0}.preview img{max-width:100%}.preview hr{border:0;border-top:1px solid var(--line);margin:2em 0}.preview table{border-collapse:collapse}.preview td,.preview th{border:1px solid var(--line2);padding:6px 8px}

<script type="module">

const ROOM_CACHE_DB='scratch-min-room-cache-v1';

function writeRoomCacheLocal(roomId,update,ts=Date.now()){try{const bytes=update instanceof Uint8Array?update:new Uint8Array(update);/* Keep a synchronous unload-safe hot snapshot when it fits comfortably under common localStorage quotas. */if(bytes.byteLength<=1500000)localStorage.setItem(ROOM_CACHE_LOCAL+roomId,JSON.stringify({ts,u:roomCacheB64(bytes)}));else localStorage.removeItem(ROOM_CACHE_LOCAL+roomId)}catch(_){}}

async function handleMqttRelay(payload){try{const raw=typeof payload==='string'?payload:dec.decode(payload instanceof Uint8Array?payload:new Uint8Array(payload)),msg=await openJson(raw);if(msg?.v!==3||msg.from===meshActor||!['y','aw'].includes(msg.kind)||!msg.p||Math.abs(Date.now()-msg.ts)>120000)return;meshStatus.set('mqtt-relay','on');updateMeshState();await applyRelayPayload(msg.kind,b64ToBytes(msg.p),MQTT_RELAY_REMOTE)}catch(_){}}
async function publishMqttRelay(kind,bytes){if(!mqttRelayState.ready.size)return false;let payload;try{payload=await mqttRelayEnvelope(kind,bytes)}catch(_){return false}let ok=false;for(const url of mqttRelayState.ready){const c=mqttRelayState.clients.get(url);if(!c?.connected)continue;try{c.publish(mqttRelayState.topic,payload,{qos:1,retain:false});ok=true}catch(_){}}if(ok){meshStatus.set('mqtt-relay','on');updateMeshState()}return ok}
async function startMqttRelay(){meshStatus.set('mqtt-relay','loading');updateMeshState();try{const mqtt=await importMqttRelay();mqttRelayState.topic=`scratch/min/v3/${meshRoomName.replace(/[^a-z0-9]/gi,'').slice(-36)}`;const urls=pickCandidates('mqtt',3,9);for(const url of urls){try{const c=mqtt.connect(url,{clientId:`scratch_${meshActor.replace(/-/g,'').slice(0,16)}_${hash32(url).toString(16)}`,clean:true,keepalive:25,reconnectPeriod:1800,connectTimeout:6500,resubscribe:true,protocolVersion:4});mqttRelayState.clients.set(url,c);c.on('connect',()=>{mqttRelayState.ready.add(url);meshStatus.set('mqtt-relay','ready');c.subscribe(mqttRelayState.topic,{qos:1},()=>{publishMqttRelay('y',Y.encodeStateAsUpdate(ydoc)).catch(()=>{});publishMqttRelay('aw',encodeAwarenessUpdate(awareness,[ydoc.clientID])).catch(()=>{})});updateMeshState()});c.on('message',(topic,payload)=>{if(topic===mqttRelayState.topic)handleMqttRelay(payload)});c.on('close',()=>{mqttRelayState.ready.delete(url);meshStatus.set('mqtt-relay',mqttRelayState.ready.size?'ready':'degraded');updateMeshState()});c.on('error',()=>{})}catch(_){}}return true}catch(_){meshStatus.set('mqtt-relay','err');updateMeshState();return false}}
function stopMqttRelay(){for(const c of mqttRelayState.clients.values())try{c.end(true)}catch(_){}mqttRelayState.clients.clear();mqttRelayState.ready.clear()}

const nostrRelayState={module:null,pool:null,sk:null,pubkey:'',relays:[],sub:null,tag:''};
async function importNostrRelay(){if(nostrRelayState.module)return nostrRelayState.module;let last;for(const u of [`https://esm.sh/nostr-tools@${NOSTR_TOOLS_VERSION}?bundle`,`https://esm.run/nostr-tools@${NOSTR_TOOLS_VERSION}`,`https://cdn.jsdelivr.net/npm/nostr-tools@${NOSTR_TOOLS_VERSION}/+esm`]){try{const m=await import(u);if(!m.SimplePool||!m.generateSecretKey||!m.finalizeEvent)throw new Error('nostr-tools exports missing');nostrRelayState.module=m;return m}catch(e){last=e}}throw last||new Error('nostr-tools unavailable')}
async function handleNostrRelay(ev){try{const msg=await openJson(ev.content);if(msg?.v!==4||msg.from===meshActor||!['y','aw'].includes(msg.kind)||!msg.p||Math.abs(Date.now()-msg.ts)>120000)return;meshStatus.set('nostr-relay','on');updateMeshState();await applyRelayPayload(msg.kind,b64ToBytes(msg.p),NOSTR_RELAY_REMOTE)}catch(_){}}
async function publishNostrRelay(kind,bytes){if(!nostrRelayState.pool||!nostrRelayState.sk||bytes.byteLength>48000)return false;try{const m=nostrRelayState.module,content=await sealJson({v:4,kind,from:meshActor,ts:Date.now(),p:bytesToB64(bytes)}),ev=m.finalizeEvent({kind:20001,created_at:Math.floor(Date.now()/1000),tags:[['d',nostrRelayState.tag]],content},nostrRelayState.sk),promises=nostrRelayState.pool.publish(nostrRelayState.relays,ev);Promise.allSettled(promises).catch(()=>{});meshStatus.set('nostr-relay','on');updateMeshState();return true}catch(_){return false}}
async function startNostrRelay(){meshStatus.set('nostr-relay','loading');updateMeshState();try{const m=await importNostrRelay();nostrRelayState.relays=pickCandidates('nostr',6,11);nostrRelayState.tag=(await sha256Hex('relay:'+meshRoomName)).slice(0,32);const saved=localStorage.getItem('scratch-min-nostr-sk');if(saved){try{nostrRelayState.sk=b64ToBytes(saved)}catch(_){}}if(!nostrRelayState.sk||nostrRelayState.sk.length!==32){nostrRelayState.sk=m.generateSecretKey();localStorage.setItem('scratch-min-nostr-sk',bytesToB64(nostrRelayState.sk))}nostrRelayState.pubkey=m.getPublicKey(nostrRelayState.sk);nostrRelayState.pool=new m.SimplePool();nostrRelayState.sub=nostrRelayState.pool.subscribeMany(nostrRelayState.relays,[{kinds:[20001],'#d':[nostrRelayState.tag],since:Math.floor(Date.now()/1000)-20}],{onevent:handleNostrRelay});meshStatus.set('nostr-relay','ready');const full=Y.encodeStateAsUpdate(ydoc);if(full.byteLength<=48000)await publishNostrRelay('y',full);await publishNostrRelay('aw',encodeAwarenessUpdate(awareness,[ydoc.clientID]));updateMeshState();return true}catch(_){meshStatus.set('nostr-relay','err');updateMeshState();return false}}
function stopNostrRelay(){try{nostrRelayState.sub?.close?.()}catch(_){}try{nostrRelayState.pool?.close?.(nostrRelayState.relays)}catch(_){}nostrRelayState.pool=null;nostrRelayState.sub=null}
async function relayBroadcast(kind,bytes){await Promise.allSettled([publishNatsRelay(kind,bytes),publishMqttRelay(kind,bytes),publishNostrRelay(kind,bytes)])}

async function startMesh(){meshRoomName='scratch-v3:'+(await sha256Hex(MESH_APP_ID+':'+room)).slice(0,40);await refreshTurnIce().catch(()=>{});const jobs=[];for(const[name,spec]of Object.entries(MESH_STRATEGIES))for(let shard=0;shard<spec.shards;shard++)jobs.push(joinStrategy(name,shard));jobs.push(startNats(),startNkn(),startMqttRelay(),startNostrRelay());const r=await Promise.allSettled(jobs);meshReady=r.some(x=>x.status==='fulfilled'&&x.value);updateMeshState();return meshReady}
function stopMesh(){for(const w of meshWrappers.values())try{w.room.leave?.()}catch(_){}meshWrappers.clear();stopNats();stopNkn();stopMqttRelay();stopNostrRelay();try{bc?.close()}catch(_){}meshReady=false}
window.ScratchMesh={endpointCount:SIGNALING_ENDPOINT_TOTAL,endpoints:SIGNALING_ENDPOINTS,status:()=>Object.fromEntries(meshStatus),routes:()=>[...meshWrappers.values()].map(w=>({name:w.name,strategy:w.strategy,peers:w.peers.size,urls:w.urls||null})),nkn:()=>({connected:nknState.connected,address:nknState.addr,routes:nknState.routes.size,subclients:nknState.client?.readyClientIDs?.().length||0}),nats:()=>({connected:!!natsState.nc,sessions:natsState.sessions.size,relay:!!natsState.relay}),mqtt:()=>({brokers:[...mqttRelayState.ready],topic:mqttRelayState.topic}),nostrRelay:()=>({relays:nostrRelayState.relays,pubkey:nostrRelayState.pubkey}),turn:()=>({servers:storedTurnIce(),policy:rtcConfig().iceTransportPolicy}),setTurn:(iceServers)=>{const v=normalizeIceServers(iceServers);localStorage.setItem('scratch-min-turn-ice',JSON.stringify(v));runtimeTurnIce=v;return v},setTurnCredentialUrl:(url)=>{if(url)localStorage.setItem('scratch-min-turn-url',String(url));else localStorage.removeItem('scratch-min-turn-url');return refreshTurnIce()},forceRelayIce:(on=true)=>{localStorage.setItem('scratch-min-ice-policy',on?'relay':'all');return rtcConfig().iceTransportPolicy},cache:()=>({room,hydrated:roomCacheHydrated,pageCount:pageOrder.length,activePage,localHot:!!localStorage.getItem(ROOM_CACHE_LOCAL+room)})};

/* Local CRDT updates go out over every healthy discovery plane. Remote updates
   are not echoed back across planes; all clients join the same redundant planes,
   which prevents update storms while retaining signaling redundancy. */
ydoc.on('update',(update,origin)=>{if(origin===BC_REMOTE||meshWrappersHas(origin)||isRelayOrigin(origin))return;meshBroadcast('y',update).catch(()=>{});relayBroadcast('y',update).catch(()=>{})});
function meshWrappersHas(origin){for(const w of meshWrappers.values())if(w===origin)return true;return false}
awareness.on('update',({added,updated,removed},origin)=>{if(meshWrappersHas(origin)||origin===BC_REMOTE||isRelayOrigin(origin))return;const ids=[...added,...updated,...removed];if(ids.length){const u=encodeAwarenessUpdate(awareness,ids);meshBroadcast('aw',u).catch(()=>{});relayBroadcast('aw',u).catch(()=>{})}});
if(bc){bc.onmessage=e=>{const m=e.data;if(!m?.packet)return;(m.kind==='y'?openMesh(m.packet).then(u=>{receivedRemoteSync=true;Y.applyUpdate(ydoc,u,BC_REMOTE);ensureInitialPage()}):openMesh(m.packet).then(u=>applyAwarenessUpdate(awareness,u,BC_REMOTE))).catch(()=>{})};bc.postMessage({kind:'hello'});const old=bc.onmessage;bc.onmessage=e=>{const m=e.data;if(m?.kind==='hello'){sealMesh(Y.encodeStateAsUpdate(ydoc)).then(packet=>bc.postMessage({kind:'y',packet}));sealMesh(encodeAwarenessUpdate(awareness,[ydoc.clientID])).then(packet=>bc.postMessage({kind:'aw',packet}));return}old(e)}}
setInterval(()=>{const now=Date.now();for(const[k,v]of nknState.chunks)if(now-v.ts>60000)nknState.chunks.delete(k);if(natsState.nc)publishNatsPresence().catch(()=>{});if(nknState.connected)syncNknFromAwareness();updateMeshState()},30000);
const origin={name:'textarea'};
let activePage=localStorage.getItem('scratch-min-active:'+room)||'';
let boundText=null,boundObserver=null,lastValue='',previewMode=false,renderPagesQueued=0,inputApplying=false;

const hue=(ydoc.clientID*137.508)%360;
const selfColor=`hsl(${hue.toFixed(1)} 68% 68%)`;
const selfName='P-'+String(ydoc.clientID.toString(36)).slice(-4).toUpperCase();
awareness.setLocalStateField('user',{name:selfName,color:selfColor,nknAddr:''});
awareness.setLocalStateField('page',activePage||null);
let meshBooted=false;

function pageText(id){return ydoc.getText('page:'+id)}
function uniquePageIds(){const out=[],seen=new Set();for(const id of pageOrder.toArray()){const v=String(id||'');if(v&&!seen.has(v)){seen.add(v);out.push(v)}}return out}
function dedupePageOrder(){const arr=pageOrder.toArray(),seen=new Set(),remove=[];arr.forEach((id,i)=>{id=String(id||'');if(!id||seen.has(id))remove.push(i);else seen.add(id)});if(remove.length)ydoc.transact(()=>{for(let i=remove.length-1;i>=0;i--)pageOrder.delete(remove[i],1)},'dedupe')}
function ensureInitialPage(){
  dedupePageOrder();
  if(pageOrder.length===0)ydoc.transact(()=>pageOrder.insert(0,['p0']),'init');
  const ids=uniquePageIds(),next=ids.includes(activePage)?activePage:(ids[0]||'p0');
  /* A valid remembered page still has to be bound on reload. Previously this
     branch did nothing when activePage was already valid, so the rail restored
     while the textarea stayed blank until that page was clicked manually. */
  if(activePage!==next||!boundText){setActivePage(next);return}
  if(boundText!==pageText(next))bindPage(next);
  queueRenderPages();
}
function newPage(){let id;const ids=new Set(uniquePageIds());do{id='p'+randomKey(5).toLowerCase()}while(ids.has(id));ydoc.transact(()=>pageOrder.push([id]),'new-page');setActivePage(id);requestAnimationFrame(()=>$('#editor').focus())}
function pageLabel(id,index){const raw=pageText(id).toString().trim(),line=(raw.split(/\r?\n/).find(Boolean)||'').replace(/^#{1,6}\s*/,'').trim();return line||`Page ${index+1}`}
function renderPages(){renderPagesQueued=0;dedupePageOrder();const host=$('#pages'),add=$('#addPage'),ids=uniquePageIds();host.querySelectorAll('.pageBlock:not(.pageAdd)').forEach(x=>x.remove());ids.forEach((id,i)=>{const b=document.createElement('button');b.type='button';b.className='pageBlock'+(id===activePage?' active':'');b.dataset.page=id;b.title=pageLabel(id,i);b.innerHTML=`<span class="pageNo">${String(i+1).padStart(2,'0')}</span><span class="pageLabel"></span>`;b.querySelector('.pageLabel').textContent=pageLabel(id,i).slice(0,8);b.onclick=()=>setActivePage(id);host.appendChild(b)});host.insertBefore(add,host.firstChild)}
function queueRenderPages(){if(renderPagesQueued)return;renderPagesQueued=requestAnimationFrame(renderPages)}

function transformSelection(oldV,newV,start,end){let p=0;const max=Math.min(oldV.length,newV.length);while(p<max&&oldV[p]===newV[p])p++;let so=oldV.length-1,sn=newV.length-1;while(so>=p&&sn>=p&&oldV[so]===newV[sn]){so--;sn--}const del=Math.max(0,so-p+1),ins=Math.max(0,sn-p+1),delta=ins-del;const adjust=v=>v<=p?v:v>=p+del?v+delta:p+ins;return[adjust(start),adjust(end)]}
function bindPage(id){if(boundText&&boundObserver)boundText.unobserve(boundObserver);boundText=pageText(id);lastValue=boundText.toString();$('#editor').value=lastValue;boundObserver=(ev,tr)=>{const next=boundText.toString();if(next===lastValue)return;const ta=$('#editor'),focused=document.activeElement===ta,[ss,se]=focused?transformSelection(lastValue,next,ta.selectionStart,ta.selectionEnd):[0,0];lastValue=next;inputApplying=true;ta.value=next;inputApplying=false;if(focused){ta.setSelectionRange(Math.max(0,Math.min(next.length,ss)),Math.max(0,Math.min(next.length,se)))}if(previewMode)renderMarkdown();queueRenderPages()};boundText.observe(boundObserver);queueRenderPages();if(previewMode)renderMarkdown()}
function setActivePage(id){if(!id)return;activePage=id;localStorage.setItem('scratch-min-active:'+room,id);awareness.setLocalStateField('page',id);awareness.setLocalStateField('mouse',null);bindPage(id);queueRenderPages();refreshRemoteCursors()}

$('#editor').addEventListener('input',()=>{if(inputApplying||!boundText)return;const next=$('#editor').value,old=lastValue;if(next===old)return;let p=0,max=Math.min(old.length,next.length);while(p<max&&old[p]===next[p])p++;let so=old.length-1,sn=next.length-1;while(so>=p&&sn>=p&&old[so]===next[sn]){so--;sn--}const del=Math.max(0,so-p+1),ins=next.slice(p,sn+1);ydoc.transact(()=>{if(del)boundText.delete(p,del);if(ins)boundText.insert(p,ins)},origin);lastValue=next;if(previewMode)renderMarkdown();queueRenderPages()});
$('#editor').addEventListener('keydown',e=>{const ta=e.currentTarget,a=ta.selectionStart,b=ta.selectionEnd,wrap=(l,r=l)=>{e.preventDefault();const v=ta.value;ta.setRangeText(l+v.slice(a,b)+r,a,b,'end');ta.selectionStart=a+l.length;ta.selectionEnd=b+l.length;ta.dispatchEvent(new Event('input',{bubbles:true}))};if(e.key==='Tab'){e.preventDefault();ta.setRangeText('  ',a,b,'end');ta.dispatchEvent(new Event('input',{bubbles:true}))}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b')wrap('**');else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='i')wrap('_');else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')wrap('[','](url)');else if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='m'){e.preventDefault();togglePreview()}});

function renderMarkdown(){const source=boundText?.toString()||'';$('#preview').innerHTML=DOMPurify.sanitize(marked.parse(source,{gfm:true,breaks:true}))}
function togglePreview(force){previewMode=typeof force==='boolean'?force:!previewMode;$('#editor').hidden=previewMode;$('#preview').hidden=!previewMode;$('#mdToggle').classList.toggle('active',previewMode);if(previewMode)renderMarkdown()}
$('#mdToggle').onclick=()=>togglePreview();
$('#addPage').onclick=newPage;

const remote=new Map();let cursorRaf=0;
function cursorSvg(){return '<svg viewBox="0 0 13 18"><path d="M1 1v14l3.5-3.4 2.6 5.2 2.2-1.1-2.6-5.1H12z"/></svg><span class="remoteName"></span>'}
function ensureRemote(id,state){let r=remote.get(id);if(!r){const el=document.createElement('div');el.className='remoteCursor';el.dataset.client=String(id);el.innerHTML=cursorSvg();$('#remoteLayer').appendChild(el);r={el,x:0,y:0,tx:0,ty:0,init:false,last:performance.now()};remote.set(id,r)}const u=state.user||{};r.el.style.setProperty('--peer',u.color||`hsl(${(id*137.5)%360} 68% 68%)`);r.el.querySelector('.remoteName').textContent=u.name||'peer';return r}
function refreshRemoteCursors(){const states=awareness.getStates(),shell=$('#editorShell'),w=Math.max(1,shell.clientWidth),h=Math.max(1,shell.clientHeight),alive=new Set;for(const[id,state]of states){if(id===ydoc.clientID)continue;const m=state.mouse;if(state.page!==activePage||!m||Date.now()-Number(m.t||0)>15000)continue;const r=ensureRemote(id,state);alive.add(id);r.tx=Math.max(0,Math.min(w-13,Number(m.x||0)*w));r.ty=Math.max(0,Math.min(h-18,Number(m.y||0)*h));r.last=performance.now();if(!r.init){r.x=r.tx;r.y=r.ty;r.init=true}}for(const[id,r]of remote){if(!alive.has(id)){r.el.remove();remote.delete(id)}}if(remote.size&&!cursorRaf&&document.visibilityState==='visible')cursorRaf=requestAnimationFrame(cursorTick)}
function cursorTick(){cursorRaf=0;if(document.visibilityState!=='visible'||!remote.size)return;let moving=false;for(const r of remote.values()){const dx=r.tx-r.x,dy=r.ty-r.y;r.x+=dx*.24;r.y+=dy*.24;if(Math.abs(dx)+Math.abs(dy)>.2)moving=true;r.el.style.transform=`translate3d(${r.x.toFixed(2)}px,${r.y.toFixed(2)}px,0)`}if(moving)cursorRaf=requestAnimationFrame(cursorTick)}
let mousePending=null,mouseRaf=0;
function publishMouse(e){const r=$('#editorShell').getBoundingClientRect();mousePending={pageId:activePage,x:Math.max(0,Math.min(1,(e.clientX-r.left)/Math.max(1,r.width))),y:Math.max(0,Math.min(1,(e.clientY-r.top)/Math.max(1,r.height))),t:Date.now()};if(mouseRaf)return;mouseRaf=requestAnimationFrame(()=>{mouseRaf=0;if(mousePending)awareness.setLocalStateField('mouse',{x:mousePending.x,y:mousePending.y,t:Date.now()})})}
$('#editorShell').addEventListener('pointermove',publishMouse,{passive:true});$('#editorShell').addEventListener('pointerleave',()=>awareness.setLocalStateField('mouse',null),{passive:true});

function renderPeers(){const states=awareness.getStates(),dots=$('#peerDots');dots.replaceChildren();for(const[id,state]of states){const d=document.createElement('span');d.className='peerDot';d.style.background=state.user?.color||`hsl(${(id*137.5)%360} 68% 68%)`;d.title=state.user?.name||'peer';dots.appendChild(d)}const n=states.size||1;$('#peerCount').textContent=n+' peer'+(n===1?'':'s')}
awareness.on('change',()=>{renderPeers();refreshRemoteCursors();syncNknFromAwareness();updateMeshState()});
persistence.on('synced',()=>{updateMeshState();if(pageOrder.length)ensureInitialPage();scheduleRoomSnapshot(60)});
pageOrder.observe(()=>{if(pageOrder.length)ensureInitialPage();queueRenderPages()});
ydoc.on('update',()=>queueRenderPages());
/* Local room state wins the boot race. If a room exists in either cache,
   display it immediately; only an actually empty local room waits briefly for
   a remote peer before creating p0. */
const hadLocalRoomState=pageOrder.length>0;
if(hadLocalRoomState){ensureInitialPage();/* restore active textarea immediately */}
renderPeers();updateMeshState();
meshBooted=true;startMesh().catch(()=>updateMeshState());
if(!hadLocalRoomState)setTimeout(()=>{if(pageOrder.length===0)ensureInitialPage()},1400);
/* Persist the post-hydration state once even when there are no edits this run. */
scheduleRoomSnapshot(80);

function openNewRoom(){const key=randomKey(),u=new URL(location.href);u.hash=key;u.search='';window.open(u.toString(),'_blank','noopener')}
$('#newRoom').onclick=openNewRoom;
function showShare(){const link=location.href;$('#shareLink').value=link;const q=$('#qr');q.replaceChildren();if(window.QRCode)new QRCode(q,{text:link,width:192,height:192,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});else q.textContent=room;$('#shareModal').hidden=false;$('#copyLink').focus()}
function hideShare(){$('#shareModal').hidden=true}
$('#shareRoom').onclick=showShare;$('#shareClose').onclick=hideShare;$('#shareModal').addEventListener('pointerdown',e=>{if(e.target===$('#shareModal'))hideShare()});
$('#copyLink').onclick=async()=>{try{await navigator.clipboard.writeText($('#shareLink').value);$('#copyLink').textContent='COPIED';setTimeout(()=>$('#copyLink').textContent='COPY',1000)}catch(_){$('#shareLink').select();document.execCommand('copy')}};
$('#roomKey').onclick=async()=>{const link=location.href,el=$('#roomKey'),old=el.textContent;try{await navigator.clipboard.writeText(link)}catch(_){const ta=document.createElement('textarea');ta.value=link;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}el.textContent='COPIED';setTimeout(()=>{el.textContent=old},900)};
window.addEventListener('keydown',e=>{if(e.key==='Escape')hideShare()});

const tooltip=$('#tooltip');let tipTimer=0;
document.addEventListener('pointerover',e=>{const t=e.target.closest?.('[data-tip]');if(!t)return;clearTimeout(tipTimer);tipTimer=setTimeout(()=>{tooltip.textContent=t.dataset.tip;const r=t.getBoundingClientRect();tooltip.style.left=Math.max(6,Math.min(innerWidth-tooltip.offsetWidth-6,r.left+r.width/2-tooltip.offsetWidth/2))+'px';tooltip.style.top=(r.bottom+7)+'px';tooltip.classList.add('show')},300)});document.addEventListener('pointerout',e=>{if(e.target.closest?.('[data-tip]')){clearTimeout(tipTimer);tooltip.classList.remove('show')}});
window.addEventListener('resize',refreshRemoteCursors,{passive:true});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshRemoteCursors();else if(cursorRaf){cancelAnimationFrame(cursorRaf);cursorRaf=0}});
function flushRoomSnapshotForExit(){try{const update=Y.encodeStateAsUpdate(ydoc),ts=Date.now();writeRoomCacheLocal(room,update,ts);writeRoomCache(room,update,ts).catch(()=>{})}catch(_){}}
window.addEventListener('pagehide',flushRoomSnapshotForExit,{capture:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushRoomSnapshotForExit()},{capture:true});
window.addEventListener('beforeunload',()=>{flushRoomSnapshotForExit();awareness.setLocalStateField('mouse',null);stopMesh();awareness.destroy();persistence.destroy();ydoc.destroy()});
</script>
</body>
