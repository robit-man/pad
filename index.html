<style>
:root{
  --bg:#000;--panel:#080808;--panel2:#0e0e0e;--ink:#ededed;--muted:#6f6f6f;
  --line:#202020;--line2:#343434;--hover:#151515;--active:#e8e8e8;--activeInk:#0a0a0a;
  --rail:76px;--top:46px;--radius:8px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,textarea,input{font:inherit}button{color:inherit}
.app{height:100%;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr)}
.topbar{grid-column:1/-1;display:grid;grid-template-columns:minmax(110px,1fr) auto minmax(110px,1fr);align-items:center;border-bottom:1px solid var(--line);background:#000;backdrop-filter:none;z-index:30}
.peers{display:flex;align-items:center;gap:7px;min-width:0;padding-left:12px;color:var(--muted);font-size:9px;letter-spacing:.05em;white-space:nowrap}
.peerDots{display:flex;align-items:center}.peerDot{width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,.32);margin-left:-2px;box-shadow:0 0 0 2px var(--bg)}.peerDot:first-child{margin-left:0}
.roomKey{justify-self:center;border:0;background:transparent;color:#919aa2;font:700 10px/1 var(--mono);letter-spacing:.18em;padding:8px;cursor:pointer;user-select:none}
.topActions{justify-self:end;display:flex;align-items:center;gap:5px;padding-right:8px}
.iconBtn{width:32px;height:32px;padding:0;border:1px solid transparent;background:transparent;display:grid;place-items:center;border-radius:7px;cursor:pointer;color:#909090}.iconBtn:hover,.iconBtn:focus-visible{border-color:var(--line2);background:var(--hover);color:#f2f2f2;outline:none}.iconBtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail{grid-column:1;grid-row:2;min-height:0;border-right:1px solid var(--line);background:#000;padding:10px;overflow-y:auto;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.pages{display:grid;gap:8px}.pageBlock{width:54px;height:54px;border:1px solid var(--line);background:#000;border-radius:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr;align-content:center;text-align:left;padding:7px;cursor:pointer;overflow:hidden;color:#8d8d8d;transition:.12s;position:relative}.pageBlock:hover{border-color:#4a4a4a;background:#171717;color:#dddddd}.pageBlock.active{background:var(--active);border-color:var(--active);color:var(--activeInk)}.pageNo{grid-column:1;grid-row:1;font:800 8px/1 var(--mono);opacity:.64;align-self:center}.pageLabel{grid-column:1/-1;grid-row:2;align-self:end;font:700 9px/1.15 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.pageDelete{grid-column:2;grid-row:1;width:15px;height:15px;min-width:15px;padding:0;padding-bottom:2px;border:1px solid currentColor;border-radius:50%;background:transparent;color:inherit;display:grid;place-items:center;font:800 10px/1 var(--mono);cursor:pointer;opacity:.62;transform:translate(2px,-2px)}.pageDelete:hover,.pageDelete:focus-visible{opacity:1;background:var(--activeInk);color:var(--active);outline:none}.pageAdd{display:flex;justify-content:center;align-items:center;padding:0;font-size:24px;font-weight:200;line-height:1;color:var(--active);border-style:dashed}.pageAdd:hover{color:var(--active)}
.workspace{grid-column:2;grid-row:2;position:relative;min-width:0;min-height:0;background:var(--bg)}
.editorShell{position:absolute;inset:0;overflow:hidden}.remoteSelections{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}.remoteSelections[hidden]{display:none}.remoteSelectionMirror{position:absolute;left:0;top:0;width:100%;min-height:100%;padding:clamp(22px,4vw,62px) clamp(24px,7vw,108px) 90px;font:400 clamp(15px,1.35vw,19px)/1.72 var(--mono);letter-spacing:-.012em;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;color:transparent;tab-size:2;pointer-events:none;will-change:transform}.remoteSelectionMark{color:transparent;background:color-mix(in srgb,var(--peer) 24%,transparent);box-shadow:inset 0 -1px color-mix(in srgb,var(--peer) 58%,transparent);border-radius:2px}.editor{position:absolute;inset:0;z-index:2;width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:#ededed;padding:clamp(22px,4vw,62px) clamp(24px,7vw,108px) 90px;font:400 clamp(15px,1.35vw,19px)/1.72 var(--mono);letter-spacing:-.012em;caret-color:#fff;tab-size:2;overflow:auto}.editor::selection{background:#3a3a3a;color:#fff}.editor::placeholder{color:#3f3f3f}
.preview{position:absolute;inset:0;z-index:3;overflow:auto;padding:clamp(22px,4vw,62px) clamp(24px,7vw,108px) 90px;font:400 clamp(15px,1.35vw,19px)/1.72 system-ui,sans-serif;color:#e5e5e5}.preview[hidden]{display:none}.preview h1,.preview h2,.preview h3{font-family:var(--mono);letter-spacing:-.04em;margin:1.3em 0 .55em}.preview h1{font-size:2em}.preview h2{font-size:1.45em}.preview h3{font-size:1.16em}.preview p{margin:.7em 0}.preview code,.preview pre{font-family:var(--mono);background:#111111;border:1px solid var(--line)}.preview code{padding:.08em .35em;border-radius:4px}.preview pre{padding:14px;overflow:auto;border-radius:6px}.preview pre code{border:0;padding:0;background:transparent}.preview blockquote{margin:1em 0;padding-left:15px;border-left:2px solid #555;color:#b3b3b3}.preview a{color:#d0d0d0}.preview img{max-width:100%}.preview hr{border:0;border-top:1px solid var(--line);margin:2em 0}.preview table{border-collapse:collapse}.preview td,.preview th{border:1px solid var(--line2);padding:6px 8px}
.bottomActions{position:absolute;right:14px;bottom:14px;z-index:8;display:flex;align-items:center;gap:5px}.bottomIconBtn{width:32px;height:32px;padding:0;border:1px solid transparent;border-radius:7px;background:transparent;color:#707070;display:grid;place-items:center;cursor:pointer}.bottomIconBtn:hover,.bottomIconBtn:focus-visible{border-color:var(--line2);background:var(--hover);color:#f2f2f2;outline:none}.bottomIconBtn:disabled{opacity:.24;cursor:default;pointer-events:none}.bottomIconBtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.mdToggle{border:0!important;background:transparent!important}.mdToggle:hover,.mdToggle:focus-visible,.mdToggle.active{border:0!important;background:transparent!important;color:#efefef}
.remoteLayer{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}.remoteCursor{position:absolute;left:0;top:0;width:13px;height:18px;will-change:transform;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}.remoteCursor svg{width:13px;height:18px;display:block;fill:var(--peer);stroke:rgba(0,0,0,.65);stroke-width:.75}.remoteName{position:absolute;left:10px;top:12px;background:var(--peer);color:#090909;padding:2px 4px;border-radius:4px;font:800 7px/1 var(--mono);white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.syncState{position:absolute;left:12px;bottom:12px;color:#424a51;font:700 7px/1 var(--mono);letter-spacing:.06em;pointer-events:none}.syncState.online{color:#59715f}.syncState.warn{color:#8c6a54}
.modalBackdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.54);display:grid;place-items:center;padding:20px;backdrop-filter:blur(8px)}.modalBackdrop[hidden]{display:none}.shareCard{width:min(390px,100%);border:1px solid #333;background:#0a0a0a;border-radius:12px;padding:18px;box-shadow:0 22px 70px rgba(0,0,0,.55)}.shareHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.shareHead strong{font:800 10px/1 var(--mono);letter-spacing:.12em}.shareClose{width:27px;height:27px;border:0;background:transparent;color:#7f7f7f;font-size:20px;cursor:pointer}.qr{width:210px;height:210px;margin:0 auto 16px;display:grid;place-items:center;background:#fff;border-radius:8px;padding:9px}.qr canvas,.qr img{max-width:100%;max-height:100%}.shareLink{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}.shareLink input{min-width:0;height:34px;border:1px solid var(--line2);border-radius:7px;background:#050505;color:#b3b3b3;padding:0 9px;font-size:9px}.copyBtn{height:34px;border:1px solid var(--line2);border-radius:7px;background:#121212;color:#dddddd;padding:0 12px;font-size:9px;cursor:pointer}.shareHint{margin-top:10px;color:#5f5f5f;font:600 8px/1.45 var(--mono)}
.tooltip{position:fixed;z-index:200;pointer-events:none;background:#050505;color:#e8e8e8;border:1px solid #333;border-radius:5px;padding:5px 7px;font:700 8px/1 var(--mono);white-space:nowrap;opacity:0;transform:translateY(3px);transition:opacity .1s,transform .1s}.tooltip.show{opacity:1;transform:none}
@media(max-width:700px){:root{--rail:64px;--top:44px}.rail{padding:7px}.pageBlock{width:48px;height:48px}.editor,.preview,.remoteSelectionMirror{padding:24px 20px 80px}.editor,.remoteSelectionMirror,.shareLink input{font-size:16px!important}.peers{padding-left:8px}.roomKey{font-size:9px}.topActions{padding-right:5px}.iconBtn{width:30px;height:30px}.bottomActions{right:10px;bottom:10px}.bottomIconBtn{width:30px;height:30px}}
</style>

<body>
<div class="app">
  <header class="topbar">
    <div class="peers" id="peers" aria-label="Peers"><div class="peerDots" id="peerDots"></div><span id="peerCount">1 peer</span></div>
    <div class="roomKey" id="roomKey" title="Room key"></div>
    <div class="topActions">
      <button class="iconBtn" id="newRoom" type="button" aria-label="New room" data-tip="New room in new tab">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="iconBtn" id="shareRoom" type="button" aria-label="Share room" data-tip="Share room">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.5-4.4M8.2 13.2l7.5 4.4"/></svg>
      </button>
    </div>
  </header>
  <aside class="rail" aria-label="Pages"><div class="pages" id="pages"><button class="pageBlock pageAdd" id="addPage" type="button" aria-label="New page" data-tip="New page">+</button></div></aside>
  <main class="workspace" id="workspace">
    <div class="editorShell" id="editorShell">
      <div class="remoteSelections" id="remoteSelections" aria-hidden="true"></div>
      <textarea class="editor" id="editor" spellcheck="true" autocomplete="off" autocapitalize="sentences" placeholder="write…"></textarea>
      <article class="preview" id="preview" hidden></article>
      <div class="remoteLayer" id="remoteLayer" aria-hidden="true"></div>
      <div class="bottomActions" aria-label="Editor actions">
        <button class="bottomIconBtn" id="undoBtn" type="button" aria-label="Undo" data-tip="Undo · Ctrl/⌘ Z" data-tip-pos="top" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5"/><path d="M5 12h8a6 6 0 1 1 0 12" transform="translate(0 -6)"/></svg>
        </button>
        <button class="bottomIconBtn" id="redoBtn" type="button" aria-label="Redo" data-tip="Redo · Ctrl/⌘ Shift Z" data-tip-pos="top" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 5 5-5 5"/><path d="M19 12h-8a6 6 0 1 0 0 12" transform="translate(0 -6)"/></svg>
        </button>
        <button class="bottomIconBtn mdToggle" id="mdToggle" type="button" aria-label="Markdown preview" data-tip="Markdown preview · Ctrl/⌘ Shift M" data-tip-pos="top">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17V7l4 6 4-6v10"/><path d="M16 9v8"/><path d="m13.5 14.5 2.5 2.5 2.5-2.5"/></svg>
        </button>
      </div>
      <div class="syncState" id="syncState">starting</div>
    </div>
  </main>
</div>
<div class="modalBackdrop" id="shareModal" hidden>
  <section class="shareCard" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <div class="shareHead"><strong id="shareTitle">SHARE ROOM</strong><button class="shareClose" id="shareClose" type="button" aria-label="Close">×</button></div>
    <div class="qr" id="qr"></div>
    <div class="shareLink"><input id="shareLink" readonly><button class="copyBtn" id="copyLink" type="button">COPY</button></div>
    <div class="shareHint">Room key is at most 8 characters. Pages, text, and live peer positions synchronize automatically.</div>
  </section>
</div>
<div class="tooltip" id="tooltip"></div>
<script type="module">
// Keep the scratchpad at a fixed 1:1 browser scale.
for(const ev of ['gesturestart','gesturechange','gestureend']){
  document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
}
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
import * as Y from 'https://esm.sh/yjs@13.6.27';
import { Awareness, encodeAwarenessUpdate, applyAwarenessUpdate } from 'https://esm.sh/y-protocols@1.0.6/awareness?deps=yjs@13.6.27';
import { IndexeddbPersistence } from 'https://esm.sh/y-indexeddb@9.0.12?deps=yjs@13.6.27';
import { marked } from 'https://esm.sh/marked@15.0.7';
import DOMPurify from 'https://esm.sh/dompurify@3.2.4';

const $=s=>document.querySelector(s);
const ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const randomKey=(n=8)=>Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>ALPHABET[x%ALPHABET.length]).join('');
const cleanKey=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
let room=cleanKey(location.hash.slice(1));
if(!room){room=randomKey();history.replaceState(null,'',location.pathname+location.search+'#'+room)}
else if(location.hash.slice(1)!==room)history.replaceState(null,'',location.pathname+location.search+'#'+room);
$('#roomKey').textContent='#'+room;$('#roomKey').title='Copy room link';
document.title='PAD · '+room;

/* Room-local persistence is intentionally hydrated before any network provider
   starts. y-indexeddb remains the CRDT update log; the snapshot cache below is
   a second, room-scoped recovery path that also avoids a missed `synced` event
   leaving the UI unbound after reload. */
const ROOM_CACHE_DB='scratch-min-room-cache-v1';
const ROOM_CACHE_STORE='rooms';
const ROOM_CACHE_LOCAL='scratch-min-room-snapshot:';
const ROOM_CACHE_ORIGIN={name:'room-cache'};
const roomCacheB64=bytes=>{const b=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes),chunk=0x8000;let out='';for(let i=0;i<b.length;i+=chunk)out+=String.fromCharCode(...b.subarray(i,i+chunk));return btoa(out)};
const roomCacheUnb64=str=>{const raw=atob(String(str||'')),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out};
function openRoomCacheDb(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(new Error('IndexedDB unavailable'));const req=indexedDB.open(ROOM_CACHE_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(ROOM_CACHE_STORE))db.createObjectStore(ROOM_CACHE_STORE,{keyPath:'room'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('room cache open failed'))})}
async function readRoomCache(roomId){let idbRec=null,localRec=null;try{const db=await openRoomCacheDb();idbRec=await new Promise((resolve,reject)=>{const tx=db.transaction(ROOM_CACHE_STORE,'readonly'),req=tx.objectStore(ROOM_CACHE_STORE).get(roomId);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)});db.close()}catch(_){}try{const raw=localStorage.getItem(ROOM_CACHE_LOCAL+roomId);if(raw){const j=JSON.parse(raw);if(j?.u)localRec={room:roomId,ts:Number(j.ts)||0,update:roomCacheUnb64(j.u)}}}catch(_){}const a=idbRec&&idbRec.update?{room:roomId,ts:Number(idbRec.ts)||0,update:new Uint8Array(idbRec.update)}:null;return !a?localRec:!localRec?a:(localRec.ts>a.ts?localRec:a)}
async function writeRoomCache(roomId,update,ts=Date.now()){const bytes=update instanceof Uint8Array?update:new Uint8Array(update);try{const db=await openRoomCacheDb();await new Promise((resolve,reject)=>{const tx=db.transaction(ROOM_CACHE_STORE,'readwrite');tx.objectStore(ROOM_CACHE_STORE).put({room:roomId,ts,update:bytes.slice().buffer});tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('room cache aborted'))});db.close()}catch(_){}return bytes}
function writeRoomCacheLocal(roomId,update,ts=Date.now()){try{const bytes=update instanceof Uint8Array?update:new Uint8Array(update);/* Keep a synchronous unload-safe hot snapshot when it fits comfortably under common localStorage quotas. */if(bytes.byteLength<=1500000)localStorage.setItem(ROOM_CACHE_LOCAL+roomId,JSON.stringify({ts,u:roomCacheB64(bytes)}));else localStorage.removeItem(ROOM_CACHE_LOCAL+roomId)}catch(_){}}

const ydoc=new Y.Doc();
let roomCacheHydrated=false;
try{const cached=await readRoomCache(room);if(cached?.update?.byteLength){Y.applyUpdate(ydoc,cached.update,ROOM_CACHE_ORIGIN);roomCacheHydrated=true}}catch(_){}
const persistence=new IndexeddbPersistence('scratch-min-'+room,ydoc);
/* Do not rely on a later event listener: wait for y-indexeddb's first replay now. */
try{await Promise.race([persistence.whenSynced,new Promise(resolve=>setTimeout(resolve,1800))])}catch(_){}
const awareness=new Awareness(ydoc);
const pageOrder=ydoc.getArray('page-order');
let roomCacheTimer=0,roomCacheWriteInFlight=Promise.resolve();
function snapshotRoomState({syncLocal=false}={}){const update=Y.encodeStateAsUpdate(ydoc),ts=Date.now();if(syncLocal)writeRoomCacheLocal(room,update,ts);roomCacheWriteInFlight=roomCacheWriteInFlight.catch(()=>{}).then(()=>writeRoomCache(room,update,ts));return roomCacheWriteInFlight}
function scheduleRoomSnapshot(delay=140){clearTimeout(roomCacheTimer);roomCacheTimer=setTimeout(()=>{roomCacheTimer=0;const update=Y.encodeStateAsUpdate(ydoc),ts=Date.now();writeRoomCacheLocal(room,update,ts);roomCacheWriteInFlight=roomCacheWriteInFlight.catch(()=>{}).then(()=>writeRoomCache(room,update,ts))},delay)}
ydoc.on('update',()=>scheduleRoomSnapshot());

/* Extreme-redundancy discovery fabric. 100 baked candidates are distributed
   across independent failure domains; only bounded deterministic subsets are
   live at once so redundancy does not mean 100 permanent sockets. */
const TRYSTERO_VERSION='0.25.4';
const NATS_VERSION='3.4.0';
const NKN_VERSION='1.3.6';
const NKN_SUBCLIENTS=(matchMedia?.('(pointer:coarse)')?.matches||/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent))?1:2;
const NKN_BOOTSTRAP_SYNC_MS=60000,NKN_MAX_PENDING_SENDS=24,NKN_CONNECT_WATCHDOG_MS=45000,NKN_RECYCLE_COOLDOWN_MS=90000;
let nknLoadPromise=null;
function installNknConsoleGuard(){if(window.__padNknConsoleGuard)return;window.__padNknConsoleGuard=1;const state={sig:new Map(),windowStart:Date.now(),count:0,suppressed:0};const methods=['log','debug','info','warn','error'];const raw={};for(const m of methods)raw[m]=console[m]?.bind(console);const snapshot=v=>{try{if(v instanceof Error)return `${v.name}: ${v.message}`;if(typeof v==='string')return v;if(v==null||['number','boolean','bigint'].includes(typeof v))return String(v);if(v instanceof Uint8Array)return `Uint8Array(${v.byteLength})`;return JSON.stringify(v,(k,x)=>typeof x==='object'&&x!==null?'[object]':x).slice(0,600)}catch(_){return Object.prototype.toString.call(v)}};const noisy=text=>/nkn|rpc call failed|mainnet-rpc|seed rpc|websocket.*(?:close|error|connect)|connect.*node|reconnect/i.test(text);for(const m of methods)console[m]=(...args)=>{const parts=args.map(snapshot),text=parts.join(' ');if(!noisy(text))return raw[m]?.(...args);const now=Date.now();if(now-state.windowStart>60000){state.windowStart=now;state.count=0}const sig=text.replace(/\b\d{2,}\b/g,'#').slice(0,280),x=state.sig.get(sig)||{n:0,t:0};if(now-x.t>30000)x.n=0;x.t=now;x.n++;state.sig.set(sig,x);if(x.n>2||state.count>40){state.suppressed++;return}state.count++;raw[m]?.(`[NKN] ${parts.join(' ')}`)};setInterval(()=>{const cut=Date.now()-120000;for(const[k,v]of state.sig)if(v.t<cut)state.sig.delete(k)},60000);window.PADNknLogs={stats:()=>({signatures:state.sig.size,suppressed:state.suppressed,minuteCount:state.count})}}
installNknConsoleGuard();
const MQTTJS_VERSION='5.15.2';
const NOSTR_TOOLS_VERSION='2.25.2';
const MESH_APP_ID='robit-encrypted-scratchpad-v3';
const enc=new TextEncoder(),dec=new TextDecoder();
const MESH_STRATEGIES={
  nostr:{pkg:'@trystero-p2p/nostr',label:'NOSTR',priority:0,shards:3,batch:8},
  mqtt:{pkg:'@trystero-p2p/mqtt',label:'MQTT',priority:1,shards:2,batch:5},
  torrent:{pkg:'@trystero-p2p/torrent',label:'BITTORRENT',priority:2,shards:2,batch:5}
};
const SIGNALING_ENDPOINTS={
  nostr:[
    'wss://nos.lol','wss://relay.damus.io','wss://relay.primal.net','wss://relay.nostr.band','wss://relay.snort.social','wss://nostr.wine','wss://nostr.mom','wss://relay.nostr.bg','wss://nostr-pub.wellorder.net','wss://relay.nostr.info',

  if(previewMode||document.activeElement!==ta||!activePage||!boundText){awareness.setLocalStateField('selection',null);return}
  const a=Math.max(0,Math.min(ta.value.length,ta.selectionStart||0)),b=Math.max(0,Math.min(ta.value.length,ta.selectionEnd||0));
  if(a===b){awareness.setLocalStateField('selection',null);return}
  awareness.setLocalStateField('selection',{page:activePage,a:encodeSelectionPoint(a),b:encodeSelectionPoint(b),t:Date.now()})
}
function scheduleSelectionPublish(){if(selectionPublishRaf)return;selectionPublishRaf=requestAnimationFrame(publishSelection)}
for(const ev of ['select','keyup','pointerup','touchend','focus'])$('#editor').addEventListener(ev,scheduleSelectionPublish,{passive:true});
document.addEventListener('selectionchange',()=>{if(document.activeElement===$('#editor'))scheduleSelectionPublish()},{passive:true});
$('#editor').addEventListener('blur',()=>awareness.setLocalStateField('selection',null));


function renderMarkdown(){const source=boundText?.toString()||'';$('#preview').innerHTML=DOMPurify.sanitize(marked.parse(source,{gfm:true,breaks:true}))}
function togglePreview(force){previewMode=typeof force==='boolean'?force:!previewMode;$('#editor').hidden=previewMode;$('#preview').hidden=!previewMode;$('#remoteSelections').hidden=previewMode;$('#mdToggle').classList.toggle('active',previewMode);if(previewMode){awareness.setLocalStateField('selection',null);renderMarkdown()}else{refreshRemoteSelections();requestAnimationFrame(scheduleSelectionPublish)}}
$('#undoBtn').onclick=undoActivePage;
$('#redoBtn').onclick=redoActivePage;
$('#mdToggle').onclick=()=>togglePreview();
$('#addPage').onclick=newPage;

const remoteSelections=new Map();
function peerColor(id,state){return state?.user?.color||`hsl(${(id*137.5)%360} 68% 68%)`}
function ensureRemoteSelectionMirror(id,state){let el=remoteSelections.get(id);if(!el){el=document.createElement('div');el.className='remoteSelectionMirror';el.dataset.client=String(id);$('#remoteSelections').appendChild(el);remoteSelections.set(id,el)}el.style.setProperty('--peer',peerColor(id,state));return el}
function syncRemoteSelectionScroll(){const ta=$('#editor'),x=-(ta.scrollLeft||0),y=-(ta.scrollTop||0);for(const el of remoteSelections.values())el.style.transform=`translate3d(${x}px,${y}px,0)`}
function renderPeerSelection(el,text,start,end){start=Math.max(0,Math.min(text.length,start));end=Math.max(0,Math.min(text.length,end));if(end<start)[start,end]=[end,start];el.replaceChildren();if(start===end)return;el.append(document.createTextNode(text.slice(0,start)));const mark=document.createElement('span');mark.className='remoteSelectionMark';mark.textContent=text.slice(start,end)||'\u200b';el.append(mark,document.createTextNode(text.slice(end)));/* preserve final textarea line box */if(text.endsWith('\n'))el.append(document.createTextNode('\u200b'))}
function refreshRemoteSelections(){
  const host=$('#remoteSelections');if(!host||previewMode)return;const states=awareness.getStates(),text=boundText?.toString()||'',alive=new Set;
  for(const[id,state]of states){if(id===ydoc.clientID)continue;const sel=state.selection;if(state.page!==activePage||sel?.page!==activePage||!sel?.a||!sel?.b)continue;const a=decodeSelectionPoint(sel.a,activePage),b=decodeSelectionPoint(sel.b,activePage);if(a==null||b==null||a===b)continue;const el=ensureRemoteSelectionMirror(id,state);alive.add(id);renderPeerSelection(el,text,a,b)}
  for(const[id,el]of remoteSelections){if(!alive.has(id)){el.remove();remoteSelections.delete(id)}}syncRemoteSelectionScroll()
}
$('#editor').addEventListener('scroll',()=>{syncRemoteSelectionScroll();refreshRemoteCursors()},{passive:true});

const remote=new Map();let cursorRaf=0;
function cursorSvg(){return '<svg viewBox="0 0 13 18"><path d="M1 1v14l3.5-3.4 2.6 5.2 2.2-1.1-2.6-5.1H12z"/></svg><span class="remoteName"></span>'}
function ensureRemote(id,state){let r=remote.get(id);if(!r){const el=document.createElement('div');el.className='remoteCursor';el.dataset.client=String(id);el.innerHTML=cursorSvg();$('#remoteLayer').appendChild(el);r={el,x:0,y:0,tx:0,ty:0,init:false,last:performance.now()};remote.set(id,r)}const u=state.user||{};r.el.style.setProperty('--peer',u.color||`hsl(${(id*137.5)%360} 68% 68%)`);r.el.querySelector('.remoteName').textContent=u.name||'peer';return r}
function refreshRemoteCursors(){const states=awareness.getStates(),shell=$('#editorShell'),w=Math.max(1,shell.clientWidth),h=Math.max(1,shell.clientHeight),alive=new Set;for(const[id,state]of states){if(id===ydoc.clientID)continue;const m=state.mouse;if(state.page!==activePage||!m||Date.now()-Number(m.t||0)>15000)continue;const r=ensureRemote(id,state);alive.add(id);r.tx=Math.max(0,Math.min(w-13,Number(m.x||0)*w));r.ty=Math.max(0,Math.min(h-18,Number(m.y||0)*h));r.last=performance.now();if(!r.init){r.x=r.tx;r.y=r.ty;r.init=true}}for(const[id,r]of remote){if(!alive.has(id)){r.el.remove();remote.delete(id)}}if(remote.size&&!cursorRaf&&document.visibilityState==='visible')cursorRaf=requestAnimationFrame(cursorTick)}
function cursorTick(){cursorRaf=0;if(document.visibilityState!=='visible'||!remote.size)return;let moving=false;for(const r of remote.values()){const dx=r.tx-r.x,dy=r.ty-r.y;r.x+=dx*.24;r.y+=dy*.24;if(Math.abs(dx)+Math.abs(dy)>.2)moving=true;r.el.style.transform=`translate3d(${r.x.toFixed(2)}px,${r.y.toFixed(2)}px,0)`}if(moving)cursorRaf=requestAnimationFrame(cursorTick)}
let mousePending=null,mouseRaf=0;
function publishMouse(e){const r=$('#editorShell').getBoundingClientRect();mousePending={pageId:activePage,x:Math.max(0,Math.min(1,(e.clientX-r.left)/Math.max(1,r.width))),y:Math.max(0,Math.min(1,(e.clientY-r.top)/Math.max(1,r.height))),t:Date.now()};if(mouseRaf)return;mouseRaf=requestAnimationFrame(()=>{mouseRaf=0;if(mousePending)awareness.setLocalStateField('mouse',{x:mousePending.x,y:mousePending.y,t:Date.now()})})}
$('#editorShell').addEventListener('pointermove',publishMouse,{passive:true});$('#editorShell').addEventListener('pointerleave',()=>awareness.setLocalStateField('mouse',null),{passive:true});

function renderPeers(){const states=awareness.getStates(),dots=$('#peerDots');dots.replaceChildren();for(const[id,state]of states){const d=document.createElement('span');d.className='peerDot';d.style.background=state.user?.color||`hsl(${(id*137.5)%360} 68% 68%)`;d.title=state.user?.name||'peer';dots.appendChild(d)}const n=states.size||1;$('#peerCount').textContent=n+' peer'+(n===1?'':'s')}
awareness.on('change',()=>{renderPeers();refreshRemoteCursors();refreshRemoteSelections();syncNknFromAwareness();updateMeshState()});
persistence.on('synced',()=>{updateMeshState();if(pageOrder.length)ensureInitialPage();scheduleRoomSnapshot(60)});
pageOrder.observe(()=>{const live=new Set(uniquePageIds());for(const[id,um]of undoManagers){if(!live.has(id)){try{um.destroy()}catch(_){}undoManagers.delete(id)}}if(pageOrder.length)ensureInitialPage();queueRenderPages()});
ydoc.on('update',()=>{queueRenderPages();refreshRemoteSelections()});
/* Local room state wins the boot race. If a room exists in either cache,
   display it immediately; only an actually empty local room waits briefly for
   a remote peer before creating p0. */
const hadLocalRoomState=pageOrder.length>0;
if(hadLocalRoomState){ensureInitialPage();/* restore active textarea immediately */}
renderPeers();updateMeshState();updateUndoButtons();
meshBooted=true;startMesh().catch(()=>updateMeshState());
if(!hadLocalRoomState)setTimeout(()=>{if(pageOrder.length===0)ensureInitialPage()},1400);
/* Persist the post-hydration state once even when there are no edits this run. */
scheduleRoomSnapshot(80);

function openNewRoom(){const key=randomKey(),u=new URL(location.href);u.hash=key;u.search='';window.open(u.toString(),'_blank','noopener')}
$('#newRoom').onclick=openNewRoom;
function showShare(){const link=location.href;$('#shareLink').value=link;const q=$('#qr');q.replaceChildren();if(window.QRCode)new QRCode(q,{text:link,width:192,height:192,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});else q.textContent=room;$('#shareModal').hidden=false;$('#copyLink').focus()}
function hideShare(){$('#shareModal').hidden=true}
$('#shareRoom').onclick=showShare;$('#shareClose').onclick=hideShare;$('#shareModal').addEventListener('pointerdown',e=>{if(e.target===$('#shareModal'))hideShare()});
$('#copyLink').onclick=async()=>{try{await navigator.clipboard.writeText($('#shareLink').value);$('#copyLink').textContent='COPIED';setTimeout(()=>$('#copyLink').textContent='COPY',1000)}catch(_){$('#shareLink').select();document.execCommand('copy')}};
$('#roomKey').onclick=async()=>{const link=location.href,el=$('#roomKey'),old=el.textContent;try{await navigator.clipboard.writeText(link)}catch(_){const ta=document.createElement('textarea');ta.value=link;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}el.textContent='COPIED';setTimeout(()=>{el.textContent=old},900)};
window.addEventListener('keydown',e=>{if(e.key==='Escape')hideShare()});

const tooltip=$('#tooltip');let tipTimer=0;
document.addEventListener('pointerover',e=>{const t=e.target.closest?.('[data-tip]');if(!t)return;clearTimeout(tipTimer);tipTimer=setTimeout(()=>{tooltip.textContent=t.dataset.tip;tooltip.classList.add('show');const r=t.getBoundingClientRect(),gap=7,w=tooltip.offsetWidth,h=tooltip.offsetHeight,left=Math.max(6,Math.min(innerWidth-w-6,r.left+r.width/2-w/2));const preferTop=t.dataset.tipPos==='top',spaceBelow=innerHeight-r.bottom,spaceAbove=r.top;let top;if(preferTop||spaceBelow<h+gap+6&&spaceAbove>spaceBelow)top=r.top-h-gap;else top=r.bottom+gap;top=Math.max(6,Math.min(innerHeight-h-6,top));tooltip.style.left=left+'px';tooltip.style.top=top+'px'},300)});document.addEventListener('pointerout',e=>{if(e.target.closest?.('[data-tip]')){clearTimeout(tipTimer);tooltip.classList.remove('show')}});
window.addEventListener('resize',()=>{refreshRemoteCursors();refreshRemoteSelections()},{passive:true});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshRemoteCursors();else if(cursorRaf){cancelAnimationFrame(cursorRaf);cursorRaf=0}});
function flushRoomSnapshotForExit(){try{const update=Y.encodeStateAsUpdate(ydoc),ts=Date.now();writeRoomCacheLocal(room,update,ts);writeRoomCache(room,update,ts).catch(()=>{})}catch(_){}}
window.addEventListener('pagehide',flushRoomSnapshotForExit,{capture:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushRoomSnapshotForExit()},{capture:true});
window.addEventListener('beforeunload',()=>{flushRoomSnapshotForExit();awareness.setLocalStateField('mouse',null);awareness.setLocalStateField('selection',null);stopMesh();for(const um of undoManagers.values())try{um.destroy()}catch(_){}undoManagers.clear();awareness.destroy();persistence.destroy();ydoc.destroy()});
</script>
</body>
