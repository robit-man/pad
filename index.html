<style>

.app{height:100%;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr)}
.topbar{grid-column:1/-1;display:grid;grid-template-columns:minmax(110px,1fr) auto minmax(110px,1fr);align-items:center;border-bottom:1px solid var(--line);background:#000;backdrop-filter:none;z-index:30}

.rail{grid-column:1;grid-row:2;min-height:0;border-right:1px solid var(--line);background:#000;padding:10px;overflow-y:auto;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.pages{display:grid;gap:8px}.pageBlock{width:54px;height:54px;border:1px solid var(--line);background:#000;border-radius:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr;align-content:center;text-align:left;padding:7px;cursor:pointer;overflow:hidden;color:#8d8d8d;transition:.12s;position:relative}.pageBlock:hover{border-color:#4a4a4a;background:#171717;color:#dddddd}.pageBlock.active{background:var(--active);border-color:var(--active);color:var(--activeInk)}.pageNo{grid-column:1;grid-row:1;font:800 8px/1 var(--mono);opacity:.64;align-self:center}.pageLabel{grid-column:1/-1;grid-row:2;align-self:end;font:700 9px/1.15 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.pageDelete{grid-column:2;grid-row:1;width:15px;height:15px;min-width:15px;padding:0;padding-bottom:2px;border:1px solid currentColor;border-radius:50%;background:transparent;color:inherit;display:grid;place-items:center;font:800 10px/1 var(--mono);cursor:pointer;opacity:.62;transform:translate(2px,-2px)}.pageDelete:hover,.pageDelete:focus-visible{opacity:1;background:var(--activeInk);color:var(--active);outline:none}.pageAdd{display:flex;justify-content:center;align-items:center;padding:0;font-size:24px;font-weight:200;line-height:1;color:var(--active);border-style:dashed}.pageAdd:hover{color:var(--active)}
.workspace{grid-column:2;grid-row:2;position:relative;min-width:0;min-height:0;background:var(--bg)}
.editorShell{position:absolute;inset:0;overflow:hidden}.markdownLive{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}.markdownLive[hidden]{display:none}.markdownLiveMirror{position:absolute;left:0;top:0;width:100%;min-height:100%;padding:clamp(22px,4vw,62px) clamp(24px,7vw,108px) 90px;font:400 clamp(15px,1.35vw,19px)/1.72 var(--mono);letter-spacing:-.012em;color:#ededed;tab-size:2;pointer-events:none;will-change:transform}.markdownLiveMirror .mdLine{display:block;min-height:1.72em;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal}.markdownLiveMirror .mdSyntax{color:transparent}.markdownLiveMirror strong{font-weight:850}.markdownLiveMirror em{font-style:italic}.markdownLiveMirror del{opacity:.64}.markdownLiveMirror .mdInlineCode{background:#111;border-radius:3px;box-shadow:inset 0 0 0 1px #202020}.markdownLiveMirror a{color:#d7d7d7;text-decoration:underline;text-decoration-color:#5d5d5d;text-underline-offset:2px}.markdownLiveMirror .mdHeading{font-weight:850;color:#f4f4f4}.markdownLiveMirror .mdHeading.mdH1{font-weight:900}.markdownLiveMirror .mdQuote{color:#aaa}.markdownLiveMirror .mdListGlyph{color:#bdbdbd}.markdownLiveMirror .mdCodeLine{background:#0b0b0b;color:#cacaca}.markdownLiveMirror .mdRule{color:#414141}.markdownLiveMirror .mdRaw{color:#ededed}.remoteSelections{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}.remoteSelections[hidden]{display:none}.remoteSelectionMirror{position:absolute;left:0;top:0;width:100%;min-height:100%;padding:clamp(22px,4vw,62px) clamp(24px,7vw,108px) 90px;font:400 clamp(15px,1.35vw,19px)/1.72 var(--mono);letter-spacing:-.012em;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;color:transparent;tab-size:2;pointer-events:none;will-change:transform}.remoteSelectionMark{color:transparent;background:color-mix(in srgb,var(--peer) 24%,transparent);box-shadow:inset 0 -1px color-mix(in srgb,var(--peer) 58%,transparent);border-radius:2px}.remoteTextCarets{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}.remoteTextCaret{position:absolute;width:2px;min-height:16px;background:var(--peer);border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.35);will-change:transform,height}.remoteTextCaretFlag{position:absolute;left:0;top:-15px;max-width:96px;padding:2px 4px;border-radius:4px 4px 4px 0;background:var(--peer);color:#080808;font:800 7px/1 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 2px rgba(0,0,0,.32)}.editor{position:absolute;inset:0;z-index:3;width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:#ededed;padding:clamp(22px,4vw,62px) clamp(24px,7vw,108px) 90px;font:400 clamp(15px,1.35vw,19px)/1.72 var(--mono);letter-spacing:-.012em;caret-color:#fff;tab-size:2;overflow:auto}.editor.markdownEnabled{color:transparent}.editor::selection{background:#3a3a3a;color:#fff}.editor.markdownEnabled::selection{background:#3a3a3a;color:transparent}.editor::placeholder{color:#3f3f3f}
.preview{position:absolute;inset:0;z-index:3;overflow:auto;padding:clamp(22px,4vw,62px) clamp(24px,7vw,108px) 90px;font:400 clamp(15px,1.35vw,19px)/1.72 system-ui,sans-serif;color:#e5e5e5}.preview[hidden]{display:none}.preview h1,.preview h2,.preview h3,.preview h4,.preview h5,.preview h6{font-family:var(--mono);letter-spacing:-.04em;margin:1.3em 0 .55em;line-height:1.22}.preview h1{font-size:2em}.preview h2{font-size:1.45em}.preview h3{font-size:1.16em}.preview h4,.preview h5,.preview h6{font-size:1em}.preview p{margin:.7em 0}.preview ul,.preview ol{margin:.7em 0;padding-left:1.65em}.preview li{margin:.2em 0}.preview strong{font-weight:800}.preview del{opacity:.68}.preview .mdEmpty{color:var(--muted)}.preview code,.preview pre{font-family:var(--mono);background:#111111;border:1px solid var(--line)}.preview code{padding:.08em .35em;border-radius:4px}.preview pre{padding:14px;overflow:auto;border-radius:6px}.preview pre code{border:0;padding:0;background:transparent}.preview blockquote{margin:1em 0;padding-left:15px;border-left:2px solid #555;color:#b3b3b3}.preview a{color:#d0d0d0}.preview img{max-width:100%}.preview hr{border:0;border-top:1px solid var(--line);margin:2em 0}.preview table{border-collapse:collapse}.preview td,.preview th{border:1px solid var(--line2);padding:6px 8px}
.bottomActions{position:absolute;right:14px;bottom:14px;z-index:8;display:flex;align-items:center;gap:5px}.bottomIconBtn{width:32px;height:32px;padding:0;border:1px solid transparent;border-radius:7px;background:transparent;color:#707070;display:grid;place-items:center;cursor:pointer}.bottomIconBtn:hover,.bottomIconBtn:focus-visible{border-color:var(--line2);background:var(--hover);color:#f2f2f2;outline:none}.bottomIconBtn:disabled{opacity:.24;cursor:default;pointer-events:none}.bottomIconBtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.mdToggle{border:0!important;background:transparent!important}.mdToggle:hover,.mdToggle:focus-visible,.mdToggle.active{border:0!important;background:transparent!important;color:#efefef}
.remoteLayer{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}.remoteCursor{position:absolute;left:0;top:0;width:13px;height:18px;will-change:transform;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}.remoteCursor svg{width:13px;height:18px;display:block;fill:var(--peer);stroke:rgba(0,0,0,.65);stroke-width:.75}.remoteName{position:absolute;left:10px;top:12px;background:var(--peer);color:#090909;padding:2px 4px;border-radius:4px;font:800 7px/1 var(--mono);white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.mediaLayer{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}.mediaItem{position:absolute;pointer-events:auto;user-select:none;touch-action:none;border:1px solid transparent;border-radius:7px;overflow:visible;box-shadow:0 8px 30px rgba(0,0,0,.24);background:#050505;transition:border-color .12s,box-shadow .12s}.mediaItem:hover,.mediaItem.contextOpen{border-color:#3a3a3a;box-shadow:0 10px 34px rgba(0,0,0,.42)}.mediaItem.inline{cursor:context-menu}.mediaItem.freeform{cursor:grab}.mediaItem.freeform.dragging{cursor:grabbing;transition:none}.mediaItem img,.mediaItem video{display:block;width:100%;height:100%;object-fit:contain;border-radius:6px;background:#050505}.mediaItem video{touch-action:auto}.mediaPending{position:absolute;inset:0;display:grid;place-items:center;background:#070707;border:1px dashed #292929;border-radius:6px;color:#616161;font:700 8px/1.35 var(--mono);letter-spacing:.06em;text-align:center;padding:12px}.mediaDragHandle{position:absolute;left:5px;top:5px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.72);border:1px solid #3b3b3b;display:none;place-items:center;color:#aaa;font:700 10px/1 var(--mono);cursor:grab;z-index:2}.mediaItem.freeform:hover .mediaDragHandle{display:grid}.dropHint{position:absolute;inset:12px;z-index:40;border:1px dashed #505050;border-radius:10px;background:rgba(0,0,0,.72);display:none;place-items:center;color:#c9c9c9;font:800 10px/1 var(--mono);letter-spacing:.12em;pointer-events:none}.editorShell.mediaDropping .dropHint{display:grid}.mediaContext{position:fixed;z-index:220;min-width:176px;padding:5px;border:1px solid #343434;border-radius:7px;background:#070707;box-shadow:0 18px 48px rgba(0,0,0,.55);font:700 9px/1 var(--mono)}.mediaContext[hidden]{display:none}.mediaContextHead{padding:7px 8px 6px;color:#666;font-size:7px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}.mediaContext button{width:100%;height:29px;border:0;border-radius:4px;background:transparent;color:#aaa;text-align:left;padding:0 9px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}.mediaContext button:hover,.mediaContext button:focus-visible{background:#151515;color:#f0f0f0;outline:none}.mediaContext button.active{color:#fff}.mediaContextSep{height:1px;background:#222;margin:4px 3px}.mediaContextDanger{color:#a97777!important}.previewMediaSlot{display:block;margin:1em 0;max-width:100%}.previewMediaSlot .mediaPreviewFrame{position:relative;display:inline-block;max-width:100%;border-radius:7px;background:#050505;overflow:hidden;vertical-align:top}.previewMediaSlot img,.previewMediaSlot video{display:block;max-width:100%;height:auto;border-radius:7px;background:#050505}.previewMediaSlot .mediaPending{position:relative;min-width:220px;min-height:120px}.mediaSyncPulse{animation:mediaPulse 1.2s ease-in-out infinite alternate}@keyframes mediaPulse{from{opacity:.42}to{opacity:.88}}
.syncState{position:absolute;left:12px;bottom:12px;color:#424a51;font:700 7px/1 var(--mono);letter-spacing:.06em;pointer-events:none}.syncState.online{color:#59715f}.syncState.warn{color:#8c6a54}
.modalBackdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.54);display:grid;place-items:center;padding:20px;backdrop-filter:blur(8px)}.modalBackdrop[hidden]{display:none}.shareCard{width:min(390px,100%);border:1px solid #333;background:#0a0a0a;border-radius:12px;padding:18px;box-shadow:0 22px 70px rgba(0,0,0,.55)}.shareHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.shareHead strong{font:800 10px/1 var(--mono);letter-spacing:.12em}.shareClose{width:27px;height:27px;border:0;background:transparent;color:#7f7f7f;font-size:20px;cursor:pointer}.qr{width:210px;height:210px;margin:0 auto 16px;display:grid;place-items:center;background:#fff;border-radius:8px;padding:9px}.qr canvas,.qr img{max-width:100%;max-height:100%}.shareLink{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}.shareLink input{min-width:0;height:34px;border:1px solid var(--line2);border-radius:7px;background:#050505;color:#b3b3b3;padding:0 9px;font-size:9px}.copyBtn{height:34px;border:1px solid var(--line2);border-radius:7px;background:#121212;color:#dddddd;padding:0 12px;font-size:9px;cursor:pointer}.shareHint{margin-top:10px;color:#5f5f5f;font:600 8px/1.45 var(--mono)}
.tooltip{position:fixed;z-index:200;pointer-events:none;background:#050505;color:#e8e8e8;border:1px solid #333;border-radius:5px;padding:5px 7px;font:700 8px/1 var(--mono);white-space:nowrap;opacity:0;transform:translateY(3px);transition:opacity .1s,transform .1s}.tooltip.show{opacity:1;transform:none}
@media(max-width:700px){:root{--rail:64px;--top:44px}.rail{padding:7px}.pageBlock{width:48px;height:48px}.editor,.preview,.remoteSelectionMirror,.markdownLiveMirror{padding:24px 20px 80px}.editor,.remoteSelectionMirror,.markdownLiveMirror,.shareLink input{font-size:16px!important}.peers{padding-left:8px}.roomKey{font-size:9px}.topActions{padding-right:5px}.iconBtn{width:30px;height:30px}.bottomActions{right:10px;bottom:10px}.bottomIconBtn{width:30px;height:30px}.mediaContext{min-width:164px}.mediaDragHandle{display:grid}}
</style>

<body>
<div class="app">
  <header class="topbar">
    <div class="peers" id="peers" aria-label="Peers"><div class="peerDots" id="peerDots"></div><span id="peerCount">1 peer</span></div>
    <div class="roomKey" id="roomKey" title="Room key"></div>
    <div class="topActions">
      <button class="iconBtn" id="newRoom" type="button" aria-label="New room" data-tip="New room in new tab">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="iconBtn" id="shareRoom" type="button" aria-label="Share room" data-tip="Share room">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.5-4.4M8.2 13.2l7.5 4.4"/></svg>
      </button>
    </div>
  </header>
  <aside class="rail" aria-label="Pages"><div class="pages" id="pages"><button class="pageBlock pageAdd" id="addPage" type="button" aria-label="New page" data-tip="New page">+</button></div></aside>
  <main class="workspace" id="workspace">
    <div class="editorShell" id="editorShell">
      <div class="markdownLive" id="markdownLive" aria-hidden="true" hidden><div class="markdownLiveMirror" id="markdownLiveMirror"></div></div>
      <div class="remoteSelections" id="remoteSelections" aria-hidden="true"></div>
      <div class="remoteTextCarets" id="remoteTextCarets" aria-hidden="true"></div>
      <div class="mediaLayer" id="mediaLayer" aria-label="Page media"></div>
      <div class="dropHint" id="dropHint">DROP IMAGE / GIF / VIDEO</div>
      <textarea class="editor" id="editor" spellcheck="true" autocomplete="off" autocapitalize="sentences" placeholder="write…"></textarea>
      <article class="preview" id="preview" hidden></article>
      <div class="remoteLayer" id="remoteLayer" aria-hidden="true"></div>
      <div class="bottomActions" aria-label="Editor actions">
        <button class="bottomIconBtn" id="undoBtn" type="button" aria-label="Undo" data-tip="Undo · Ctrl/⌘ Z" data-tip-pos="top" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5"/><path d="M5 12h8a6 6 0 1 1 0 12" transform="translate(0 -6)"/></svg>
        </button>
        <button class="bottomIconBtn" id="redoBtn" type="button" aria-label="Redo" data-tip="Redo · Ctrl/⌘ Shift Z" data-tip-pos="top" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 5 5-5 5"/><path d="M19 12h-8a6 6 0 1 0 0 12" transform="translate(0 -6)"/></svg>
        </button>
        <button class="bottomIconBtn mdToggle" id="mdToggle" type="button" aria-label="Markdown formatting" data-tip="Markdown formatting · Ctrl/⌘ Shift M" data-tip-pos="top">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17V7l4 6 4-6v10"/><path d="M16 9v8"/><path d="m13.5 14.5 2.5 2.5 2.5-2.5"/></svg>
        </button>
      </div>
      <div class="syncState" id="syncState">starting</div>
    </div>
  </main>
</div>
<div class="modalBackdrop" id="shareModal" hidden>
  <section class="shareCard" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <div class="shareHead"><strong id="shareTitle">SHARE ROOM</strong><button class="shareClose" id="shareClose" type="button" aria-label="Close">×</button></div>
    <div class="qr" id="qr"></div>
    <div class="shareLink"><input id="shareLink" readonly><button class="copyBtn" id="copyLink" type="button">COPY</button></div>
    <div class="shareHint">Room key is at most 8 characters. Pages, text, media, and live peer state synchronize automatically.</div>
  </section>
</div>
<div class="mediaContext" id="mediaContext" role="menu" hidden>
  <div class="mediaContextHead" id="mediaContextHead">MEDIA</div>
  <button type="button" data-media-action="inline"><span>INLINE</span><span data-check="inline"></span></button>
  <button type="button" data-media-action="freeform"><span>FREEFORM</span><span data-check="freeform"></span></button>
  <div class="mediaContextSep"></div>
  <button type="button" data-media-action="small"><span>SMALL</span><span></span></button>
  <button type="button" data-media-action="medium"><span>MEDIUM</span><span></span></button>
  <button type="button" data-media-action="large"><span>LARGE</span><span></span></button>
  <button type="button" data-media-action="front"><span>BRING TO FRONT</span><span></span></button>
  <div class="mediaContextSep"></div>
  <button type="button" data-media-action="download"><span>DOWNLOAD</span><span></span></button>
  <button class="mediaContextDanger" type="button" data-media-action="delete"><span>DELETE</span><span></span></button>
</div>
<div class="tooltip" id="tooltip"></div>
<script type="module">
// Keep the scratchpad at a fixed 1:1 browser scale.
for(const ev of ['gesturestart','gesturechange','gestureend']){
  document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
}
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
import * as Y from 'https://esm.sh/yjs@13.6.27';
import { Awareness, encodeAwarenessUpdate, applyAwarenessUpdate } from 'https://esm.sh/y-protocols@1.0.6/awareness?deps=yjs@13.6.27';
import { IndexeddbPersistence } from 'https://esm.sh/y-indexeddb@9.0.12?deps=yjs@13.6.27';

const $=s=>document.querySelector(s);
const ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const randomKey=(n=8)=>Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>ALPHABET[x%ALPHABET.length]).join('');
const cleanKey=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
let room=cleanKey(location.hash.slice(1));
if(!room){room=randomKey();history.replaceState(null,'',location.pathname+location.search+'#'+room)}
else if(location.hash.slice(1)!==room)history.replaceState(null,'',location.pathname+location.search+'#'+room);
$('#roomKey').textContent='#'+room;$('#roomKey').title='Copy room link';
document.title='PAD · '+room;

/* Room-local persistence is intentionally hydrated before any network provider
   starts. y-indexeddb remains the CRDT update log; the snapshot cache below is
   a second, room-scoped recovery path that also avoids a missed `synced` event
   leaving the UI unbound after reload. */
const ROOM_CACHE_DB='scratch-min-room-cache-v1';
const ROOM_CACHE_STORE='rooms';
const ROOM_CACHE_LOCAL='scratch-min-room-snapshot:';
const ROOM_CACHE_ORIGIN={name:'room-cache'};
const roomCacheB64=bytes=>{const b=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes),chunk=0x8000;let out='';for(let i=0;i<b.length;i+=chunk)out+=String.fromCharCode(...b.subarray(i,i+chunk));return btoa(out)};
const roomCacheUnb64=str=>{const raw=atob(String(str||'')),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out};
function openRoomCacheDb(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(new Error('IndexedDB unavailable'));const req=indexedDB.open(ROOM_CACHE_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(ROOM_CACHE_STORE))db.createObjectStore(ROOM_CACHE_STORE,{keyPath:'room'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('room cache open failed'))})}
async function readRoomCache(roomId){

pageOrder.observe(()=>{
  const live=new Set(uniquePageIds()),removed=[...knownPageIds].filter(id=>!live.has(id));knownPageIds=live;
  for(const id of [...undoManagers.keys()])if(!live.has(id))destroyUndoManager(id);
  if(removed.length)reclaimDeletedPageText(removed);
  if(pageOrder.length)ensureInitialPage();queueRenderPages();scheduleMediaRender()
});
ydoc.on('update',(_update,origin)=>{
  queueRenderPages();refreshRemoteSelections();
  // Only explicit deletion records are enforced during live collaboration.
  // Text for a new page can arrive before its page-order update on another route.
  if(origin!=='delete-page'&&deletedPages.size&&!deletedPageCleanupTimer)deletedPageCleanupTimer=setTimeout(()=>{deletedPageCleanupTimer=0;reclaimDeletedPageText()},140)
});
/* Local room state wins the boot race. If a room exists in either cache,
   display it immediately; only an actually empty local room waits briefly for
   a remote peer before creating p0. */
const hadLocalRoomState=pageOrder.length>0;
persistence.whenSynced.then(()=>reclaimDeletedPageText(null,true)).catch(()=>{});
if(hadLocalRoomState){ensureInitialPage();/* restore active textarea immediately */}
renderPeers();updateMeshState();updateUndoButtons();setMarkdownEnabled(markdownEnabled,{persist:false});
meshBooted=true;startMesh().then(()=>requestMissingMediaAssets(350)).catch(()=>updateMeshState());scheduleMediaRender();scheduleMissingMedia();
if(!hadLocalRoomState)setTimeout(()=>{if(pageOrder.length===0)ensureInitialPage()},1400);
/* Persist the post-hydration state once even when there are no edits this run. */
scheduleRoomSnapshot(80);

function openNewRoom(){const key=randomKey(),u=new URL(location.href);u.hash=key;u.search='';window.open(u.toString(),'_blank','noopener')}
$('#newRoom').onclick=openNewRoom;
function showShare(){const link=location.href;$('#shareLink').value=link;const q=$('#qr');q.replaceChildren();if(window.QRCode)new QRCode(q,{text:link,width:192,height:192,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});else q.textContent=room;$('#shareModal').hidden=false;$('#copyLink').focus()}
function hideShare(){$('#shareModal').hidden=true}
$('#shareRoom').onclick=showShare;$('#shareClose').onclick=hideShare;$('#shareModal').addEventListener('pointerdown',e=>{if(e.target===$('#shareModal'))hideShare()});
$('#copyLink').onclick=async()=>{try{await navigator.clipboard.writeText($('#shareLink').value);$('#copyLink').textContent='COPIED';setTimeout(()=>$('#copyLink').textContent='COPY',1000)}catch(_){$('#shareLink').select();document.execCommand('copy')}};
$('#roomKey').onclick=async()=>{const link=location.href,el=$('#roomKey'),old=el.textContent;try{await navigator.clipboard.writeText(link)}catch(_){const ta=document.createElement('textarea');ta.value=link;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}el.textContent='COPIED';setTimeout(()=>{el.textContent=old},900)};
window.addEventListener('keydown',e=>{if(e.key==='Escape')hideShare()});

const tooltip=$('#tooltip');let tipTimer=0;
document.addEventListener('pointerover',e=>{const t=e.target.closest?.('[data-tip]');if(!t)return;clearTimeout(tipTimer);tipTimer=setTimeout(()=>{tooltip.textContent=t.dataset.tip;tooltip.classList.add('show');const r=t.getBoundingClientRect(),gap=7,w=tooltip.offsetWidth,h=tooltip.offsetHeight,left=Math.max(6,Math.min(innerWidth-w-6,r.left+r.width/2-w/2));const preferTop=t.dataset.tipPos==='top',spaceBelow=innerHeight-r.bottom,spaceAbove=r.top;let top;if(preferTop||spaceBelow<h+gap+6&&spaceAbove>spaceBelow)top=r.top-h-gap;else top=r.bottom+gap;top=Math.max(6,Math.min(innerHeight-h-6,top));tooltip.style.left=left+'px';tooltip.style.top=top+'px'},300)});document.addEventListener('pointerout',e=>{if(e.target.closest?.('[data-tip]')){clearTimeout(tipTimer);tooltip.classList.remove('show')}});
window.addEventListener('resize',()=>{refreshRemoteCursors();refreshRemoteSelections();if(markdownEnabled)renderLiveMarkdown();scheduleMediaRender()},{passive:true});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshRemoteCursors();else if(cursorRaf){cancelAnimationFrame(cursorRaf);cursorRaf=0}});
function flushRoomSnapshotForExit(){try{clearTimeout(roomCacheTimer);roomCacheTimer=0;writeRoomCacheLocal(room,Y.encodeStateAsUpdate(ydoc),Date.now());snapshotRoomState().catch(()=>{})}catch(_){}}
window.addEventListener('pagehide',flushRoomSnapshotForExit,{capture:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushRoomSnapshotForExit()},{capture:true});
window.addEventListener('beforeunload',()=>{clearTimeout(deletedPageCleanupTimer);destroyMedia();flushRoomSnapshotForExit();awareness.setLocalStateField('mouse',null);awareness.setLocalStateField('selection',null);clearTimeout(awarenessSendTimer);stopMesh();for(const id of [...undoManagers.keys()])destroyUndoManager(id);awareness.destroy();persistence.destroy();ydoc.destroy()});
</script>
