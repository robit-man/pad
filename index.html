<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>scratch</title>
<style>
:root{
  --bg:#0d0f11;--panel:#121518;--panel2:#171b1f;--ink:#e7eaed;--muted:#737c84;
  --line:#262c31;--line2:#353d44;--hover:#1c2227;--active:#e4e8eb;--activeInk:#111518;
  --rail:76px;--top:46px;--radius:8px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden}
button,textarea,input{font:inherit}button{color:inherit}
.app{height:100%;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr)}
.topbar{grid-column:1/-1;display:grid;grid-template-columns:minmax(110px,1fr) auto minmax(110px,1fr);align-items:center;border-bottom:1px solid var(--line);background:rgba(13,15,17,.94);backdrop-filter:blur(12px);z-index:30}
.peers{display:flex;align-items:center;gap:7px;min-width:0;padding-left:12px;color:var(--muted);font-size:9px;letter-spacing:.05em;white-space:nowrap}
.peerDots{display:flex;align-items:center}.peerDot{width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,.32);margin-left:-2px;box-shadow:0 0 0 2px var(--bg)}.peerDot:first-child{margin-left:0}
.roomKey{justify-self:center;border:0;background:transparent;color:#919aa2;font:700 10px/1 var(--mono);letter-spacing:.18em;padding:8px;cursor:default}
.topActions{justify-self:end;display:flex;align-items:center;gap:5px;padding-right:8px}
.iconBtn{width:32px;height:32px;padding:0;border:1px solid transparent;background:transparent;display:grid;place-items:center;border-radius:7px;cursor:pointer;color:#939da5}.iconBtn:hover,.iconBtn:focus-visible{border-color:var(--line2);background:var(--hover);color:#f1f4f6;outline:none}.iconBtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail{grid-column:1;grid-row:2;min-height:0;border-right:1px solid var(--line);background:#101316;padding:10px;overflow-y:auto;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.pages{display:grid;gap:8px}.pageBlock{width:54px;height:54px;border:1px solid var(--line);background:#15191d;border-radius:8px;display:grid;grid-template-rows:auto 1fr;align-content:center;text-align:left;padding:7px;cursor:pointer;overflow:hidden;color:#8d969e;transition:.12s}.pageBlock:hover{border-color:#4a555e;background:#1b2025;color:#d8dde1}.pageBlock.active{background:var(--active);border-color:var(--active);color:var(--activeInk)}.pageNo{font:800 8px/1 var(--mono);opacity:.64}.pageLabel{align-self:end;font:700 9px/1.15 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.pageAdd{place-items:center;padding:0;font-size:28px;font-weight:200;line-height:1;color:#89939a;border-style:dashed}.pageAdd:hover{color:#fff}
.workspace{grid-column:2;grid-row:2;position:relative;min-width:0;min-height:0;background:var(--bg)}
.editorShell{position:absolute;inset:0;overflow:hidden}.editor{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:#e8ebed;padding:clamp(22px,4vw,62px) clamp(24px,7vw,108px) 90px;font:400 clamp(15px,1.35vw,19px)/1.72 var(--mono);letter-spacing:-.012em;caret-color:#fff;tab-size:2;overflow:auto}.editor::selection{background:#3b4650;color:#fff}.editor::placeholder{color:#3e464d}
.preview{position:absolute;inset:0;overflow:auto;padding:clamp(22px,4vw,62px) clamp(24px,7vw,108px) 90px;font:400 clamp(15px,1.35vw,19px)/1.72 system-ui,sans-serif;color:#e3e7ea}.preview[hidden]{display:none}.preview h1,.preview h2,.preview h3{font-family:var(--mono);letter-spacing:-.04em;margin:1.3em 0 .55em}.preview h1{font-size:2em}.preview h2{font-size:1.45em}.preview h3{font-size:1.16em}.preview p{margin:.7em 0}.preview code,.preview pre{font-family:var(--mono);background:#151a1e;border:1px solid var(--line)}.preview code{padding:.08em .35em;border-radius:4px}.preview pre{padding:14px;overflow:auto;border-radius:6px}.preview pre code{border:0;padding:0;background:transparent}.preview blockquote{margin:1em 0;padding-left:15px;border-left:2px solid #59636b;color:#aeb6bc}.preview a{color:#a8c8e5}.preview img{max-width:100%}.preview hr{border:0;border-top:1px solid var(--line);margin:2em 0}.preview table{border-collapse:collapse}.preview td,.preview th{border:1px solid var(--line2);padding:6px 8px}
.mdToggle{position:absolute;right:14px;bottom:14px;z-index:8;width:34px;height:28px;border:1px solid var(--line);border-radius:7px;background:rgba(17,21,24,.9);color:#68727a;font:800 8px/1 var(--mono);cursor:pointer}.mdToggle:hover,.mdToggle.active{color:#eef2f4;border-color:#555f68;background:#1a2025}
.remoteLayer{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}.remoteCursor{position:absolute;left:0;top:0;width:13px;height:18px;will-change:transform;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}.remoteCursor svg{width:13px;height:18px;display:block;fill:var(--peer);stroke:rgba(0,0,0,.65);stroke-width:.75}.remoteName{position:absolute;left:10px;top:12px;background:var(--peer);color:#0a0d0f;padding:2px 4px;border-radius:4px;font:800 7px/1 var(--mono);white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.syncState{position:absolute;left:12px;bottom:12px;color:#424a51;font:700 7px/1 var(--mono);letter-spacing:.06em;pointer-events:none}.syncState.online{color:#59715f}.syncState.warn{color:#8c6a54}
.modalBackdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.54);display:grid;place-items:center;padding:20px;backdrop-filter:blur(8px)}.modalBackdrop[hidden]{display:none}.shareCard{width:min(390px,100%);border:1px solid #343c43;background:#111518;border-radius:12px;padding:18px;box-shadow:0 22px 70px rgba(0,0,0,.55)}.shareHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.shareHead strong{font:800 10px/1 var(--mono);letter-spacing:.12em}.shareClose{width:27px;height:27px;border:0;background:transparent;color:#7c858d;font-size:20px;cursor:pointer}.qr{width:210px;height:210px;margin:0 auto 16px;display:grid;place-items:center;background:#fff;border-radius:8px;padding:9px}.qr canvas,.qr img{max-width:100%;max-height:100%}.shareLink{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}.shareLink input{min-width:0;height:34px;border:1px solid var(--line2);border-radius:7px;background:#0b0e10;color:#aeb6bc;padding:0 9px;font-size:9px}.copyBtn{height:34px;border:1px solid var(--line2);border-radius:7px;background:#181d21;color:#d9dfe3;padding:0 12px;font-size:9px;cursor:pointer}.shareHint{margin-top:10px;color:#596269;font:600 8px/1.45 var(--mono)}
.tooltip{position:fixed;z-index:200;pointer-events:none;background:#080a0c;color:#e4e8eb;border:1px solid #333b42;border-radius:5px;padding:5px 7px;font:700 8px/1 var(--mono);white-space:nowrap;opacity:0;transform:translateY(3px);transition:opacity .1s,transform .1s}.tooltip.show{opacity:1;transform:none}
@media(max-width:700px){:root{--rail:64px;--top:44px}.rail{padding:7px}.pageBlock{width:48px;height:48px}.editor,.preview{padding:24px 20px 80px;font-size:15px}.peers{padding-left:8px}.roomKey{font-size:9px}.topActions{padding-right:5px}.iconBtn{width:30px;height:30px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="peers" id="peers" aria-label="Peers"><div class="peerDots" id="peerDots"></div><span id="peerCount">1 peer</span></div>
    <div class="roomKey" id="roomKey" title="Room key"></div>
    <div class="topActions">
      <button class="iconBtn" id="newRoom" type="button" aria-label="New room" data-tip="New room in new tab">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="iconBtn" id="shareRoom" type="button" aria-label="Share room" data-tip="Share room">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.5-4.4M8.2 13.2l7.5 4.4"/></svg>
      </button>
    </div>
  </header>
  <aside class="rail" aria-label="Pages"><div class="pages" id="pages"><button class="pageBlock pageAdd" id="addPage" type="button" aria-label="New page" data-tip="New page">+</button></div></aside>
  <main class="workspace" id="workspace">
    <div class="editorShell" id="editorShell">
      <textarea class="editor" id="editor" spellcheck="true" autocomplete="off" autocapitalize="sentences" placeholder="write…"></textarea>
      <article class="preview" id="preview" hidden></article>
      <div class="remoteLayer" id="remoteLayer" aria-hidden="true"></div>
      <button class="mdToggle" id="mdToggle" type="button" data-tip="Markdown preview · Ctrl/⌘ Shift M">MD</button>
      <div class="syncState" id="syncState">starting</div>
    </div>
  </main>
</div>
<div class="modalBackdrop" id="shareModal" hidden>
  <section class="shareCard" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <div class="shareHead"><strong id="shareTitle">SHARE ROOM</strong><button class="shareClose" id="shareClose" type="button" aria-label="Close">×</button></div>
    <div class="qr" id="qr"></div>
    <div class="shareLink"><input id="shareLink" readonly><button class="copyBtn" id="copyLink" type="button">COPY</button></div>
    <div class="shareHint">Room key is at most 8 characters. Pages, text, and live peer positions synchronize automatically.</div>
  </section>
</div>
<div class="tooltip" id="tooltip"></div>
<script type="module">
import * as Y from 'https://esm.sh/yjs@13.6.27';
import { WebrtcProvider } from 'https://esm.sh/y-webrtc@10.3.0?deps=yjs@13.6.27';
import { IndexeddbPersistence } from 'https://esm.sh/y-indexeddb@9.0.12?deps=yjs@13.6.27';
import { marked } from 'https://esm.sh/marked@15.0.7';
import DOMPurify from 'https://esm.sh/dompurify@3.2.4';

const $=s=>document.querySelector(s);
const ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const randomKey=(n=8)=>Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>ALPHABET[x%ALPHABET.length]).join('');
const cleanKey=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
let room=cleanKey(location.hash.slice(1));
if(!room){room=randomKey();history.replaceState(null,'',location.pathname+location.search+'#'+room)}
else if(location.hash.slice(1)!==room)history.replaceState(null,'',location.pathname+location.search+'#'+room);
$('#roomKey').textContent='#'+room;
document.title='scratch · '+room;

const ydoc=new Y.Doc();
const persistence=new IndexeddbPersistence('scratch-min-'+room,ydoc);
const provider=new WebrtcProvider('scratch-min-'+room,ydoc,{password:room,signaling:['wss://signaling.yjs.dev'],maxConns:24,filterBcConns:true});
const awareness=provider.awareness;
const pageOrder=ydoc.getArray('page-order');
const origin={name:'textarea'};
let activePage=localStorage.getItem('scratch-min-active:'+room)||'';
let boundText=null,boundObserver=null,lastValue='',previewMode=false,renderPagesQueued=0,inputApplying=false;

const hue=(ydoc.clientID*137.508)%360;
const selfColor=`hsl(${hue.toFixed(1)} 68% 68%)`;
const selfName='P-'+String(ydoc.clientID.toString(36)).slice(-4).toUpperCase();
awareness.setLocalStateField('user',{name:selfName,color:selfColor});
awareness.setLocalStateField('page',activePage||null);

function pageText(id){return ydoc.getText('page:'+id)}
function uniquePageIds(){const out=[],seen=new Set();for(const id of pageOrder.toArray()){const v=String(id||'');if(v&&!seen.has(v)){seen.add(v);out.push(v)}}return out}
function dedupePageOrder(){const arr=pageOrder.toArray(),seen=new Set(),remove=[];arr.forEach((id,i)=>{id=String(id||'');if(!id||seen.has(id))remove.push(i);else seen.add(id)});if(remove.length)ydoc.transact(()=>{for(let i=remove.length-1;i>=0;i--)pageOrder.delete(remove[i],1)},'dedupe')}
function ensureInitialPage(){dedupePageOrder();if(pageOrder.length===0)ydoc.transact(()=>pageOrder.insert(0,['p0']),'init');const ids=uniquePageIds();if(!ids.includes(activePage))setActivePage(ids[0]||'p0')}
function newPage(){let id;const ids=new Set(uniquePageIds());do{id='p'+randomKey(5).toLowerCase()}while(ids.has(id));ydoc.transact(()=>pageOrder.push([id]),'new-page');setActivePage(id);requestAnimationFrame(()=>$('#editor').focus())}
function pageLabel(id,index){const raw=pageText(id).toString().trim(),line=(raw.split(/\r?\n/).find(Boolean)||'').replace(/^#{1,6}\s*/,'').trim();return line||`Page ${index+1}`}
function renderPages(){renderPagesQueued=0;dedupePageOrder();const host=$('#pages'),add=$('#addPage'),ids=uniquePageIds();host.querySelectorAll('.pageBlock:not(.pageAdd)').forEach(x=>x.remove());ids.forEach((id,i)=>{const b=document.createElement('button');b.type='button';b.className='pageBlock'+(id===activePage?' active':'');b.dataset.page=id;b.title=pageLabel(id,i);b.innerHTML=`<span class="pageNo">${String(i+1).padStart(2,'0')}</span><span class="pageLabel"></span>`;b.querySelector('.pageLabel').textContent=pageLabel(id,i).slice(0,8);b.onclick=()=>setActivePage(id);host.appendChild(b)});host.insertBefore(add,host.firstChild)}
function queueRenderPages(){if(renderPagesQueued)return;renderPagesQueued=requestAnimationFrame(renderPages)}

function transformSelection(oldV,newV,start,end){let p=0;const max=Math.min(oldV.length,newV.length);while(p<max&&oldV[p]===newV[p])p++;let so=oldV.length-1,sn=newV.length-1;while(so>=p&&sn>=p&&oldV[so]===newV[sn]){so--;sn--}const del=Math.max(0,so-p+1),ins=Math.max(0,sn-p+1),delta=ins-del;const adjust=v=>v<=p?v:v>=p+del?v+delta:p+ins;return[adjust(start),adjust(end)]}
function bindPage(id){if(boundText&&boundObserver)boundText.unobserve(boundObserver);boundText=pageText(id);lastValue=boundText.toString();$('#editor').value=lastValue;boundObserver=(ev,tr)=>{const next=boundText.toString();if(next===lastValue)return;const ta=$('#editor'),focused=document.activeElement===ta,[ss,se]=focused?transformSelection(lastValue,next,ta.selectionStart,ta.selectionEnd):[0,0];lastValue=next;inputApplying=true;ta.value=next;inputApplying=false;if(focused){ta.setSelectionRange(Math.max(0,Math.min(next.length,ss)),Math.max(0,Math.min(next.length,se)))}if(previewMode)renderMarkdown();queueRenderPages()};boundText.observe(boundObserver);queueRenderPages();if(previewMode)renderMarkdown()}
function setActivePage(id){if(!id)return;activePage=id;localStorage.setItem('scratch-min-active:'+room,id);awareness.setLocalStateField('page',id);awareness.setLocalStateField('mouse',null);bindPage(id);queueRenderPages();refreshRemoteCursors()}

$('#editor').addEventListener('input',()=>{if(inputApplying||!boundText)return;const next=$('#editor').value,old=lastValue;if(next===old)return;let p=0,max=Math.min(old.length,next.length);while(p<max&&old[p]===next[p])p++;let so=old.length-1,sn=next.length-1;while(so>=p&&sn>=p&&old[so]===next[sn]){so--;sn--}const del=Math.max(0,so-p+1),ins=next.slice(p,sn+1);ydoc.transact(()=>{if(del)boundText.delete(p,del);if(ins)boundText.insert(p,ins)},origin);lastValue=next;if(previewMode)renderMarkdown();queueRenderPages()});
$('#editor').addEventListener('keydown',e=>{const ta=e.currentTarget,a=ta.selectionStart,b=ta.selectionEnd,wrap=(l,r=l)=>{e.preventDefault();const v=ta.value;ta.setRangeText(l+v.slice(a,b)+r,a,b,'end');ta.selectionStart=a+l.length;ta.selectionEnd=b+l.length;ta.dispatchEvent(new Event('input',{bubbles:true}))};if(e.key==='Tab'){e.preventDefault();ta.setRangeText('  ',a,b,'end');ta.dispatchEvent(new Event('input',{bubbles:true}))}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b')wrap('**');else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='i')wrap('_');else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')wrap('[','](url)');else if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='m'){e.preventDefault();togglePreview()}});

function renderMarkdown(){const source=boundText?.toString()||'';$('#preview').innerHTML=DOMPurify.sanitize(marked.parse(source,{gfm:true,breaks:true}))}
function togglePreview(force){previewMode=typeof force==='boolean'?force:!previewMode;$('#editor').hidden=previewMode;$('#preview').hidden=!previewMode;$('#mdToggle').classList.toggle('active',previewMode);if(previewMode)renderMarkdown()}
$('#mdToggle').onclick=()=>togglePreview();
$('#addPage').onclick=newPage;

const remote=new Map();let cursorRaf=0;
function cursorSvg(){return '<svg viewBox="0 0 13 18"><path d="M1 1v14l3.5-3.4 2.6 5.2 2.2-1.1-2.6-5.1H12z"/></svg><span class="remoteName"></span>'}
function ensureRemote(id,state){let r=remote.get(id);if(!r){const el=document.createElement('div');el.className='remoteCursor';el.dataset.client=String(id);el.innerHTML=cursorSvg();$('#remoteLayer').appendChild(el);r={el,x:0,y:0,tx:0,ty:0,init:false,last:performance.now()};remote.set(id,r)}const u=state.user||{};r.el.style.setProperty('--peer',u.color||`hsl(${(id*137.5)%360} 68% 68%)`);r.el.querySelector('.remoteName').textContent=u.name||'peer';return r}
function refreshRemoteCursors(){const states=awareness.getStates(),shell=$('#editorShell'),w=Math.max(1,shell.clientWidth),h=Math.max(1,shell.clientHeight),alive=new Set;for(const[id,state]of states){if(id===ydoc.clientID)continue;const m=state.mouse;if(state.page!==activePage||!m||Date.now()-Number(m.t||0)>15000)continue;const r=ensureRemote(id,state);alive.add(id);r.tx=Math.max(0,Math.min(w-13,Number(m.x||0)*w));r.ty=Math.max(0,Math.min(h-18,Number(m.y||0)*h));r.last=performance.now();if(!r.init){r.x=r.tx;r.y=r.ty;r.init=true}}for(const[id,r]of remote){if(!alive.has(id)){r.el.remove();remote.delete(id)}}if(remote.size&&!cursorRaf&&document.visibilityState==='visible')cursorRaf=requestAnimationFrame(cursorTick)}
function cursorTick(){cursorRaf=0;if(document.visibilityState!=='visible'||!remote.size)return;let moving=false;for(const r of remote.values()){const dx=r.tx-r.x,dy=r.ty-r.y;r.x+=dx*.24;r.y+=dy*.24;if(Math.abs(dx)+Math.abs(dy)>.2)moving=true;r.el.style.transform=`translate3d(${r.x.toFixed(2)}px,${r.y.toFixed(2)}px,0)`}if(moving)cursorRaf=requestAnimationFrame(cursorTick)}
let mousePending=null,mouseRaf=0;
function publishMouse(e){const r=$('#editorShell').getBoundingClientRect();mousePending={pageId:activePage,x:Math.max(0,Math.min(1,(e.clientX-r.left)/Math.max(1,r.width))),y:Math.max(0,Math.min(1,(e.clientY-r.top)/Math.max(1,r.height))),t:Date.now()};if(mouseRaf)return;mouseRaf=requestAnimationFrame(()=>{mouseRaf=0;if(mousePending)awareness.setLocalStateField('mouse',{x:mousePending.x,y:mousePending.y,t:Date.now()})})}
$('#editorShell').addEventListener('pointermove',publishMouse,{passive:true});$('#editorShell').addEventListener('pointerleave',()=>awareness.setLocalStateField('mouse',null),{passive:true});

function renderPeers(){const states=awareness.getStates(),dots=$('#peerDots');dots.replaceChildren();for(const[id,state]of states){const d=document.createElement('span');d.className='peerDot';d.style.background=state.user?.color||`hsl(${(id*137.5)%360} 68% 68%)`;d.title=state.user?.name||'peer';dots.appendChild(d)}const n=states.size||1;$('#peerCount').textContent=n+' peer'+(n===1?'':'s')}
awareness.on('change',()=>{renderPeers();refreshRemoteCursors()});
provider.on('status',e=>{const el=$('#syncState');el.textContent=e.status==='connected'?'live':'connecting';el.className='syncState '+(e.status==='connected'?'online':'warn')});
persistence.on('synced',()=>{$('#syncState').textContent='local + sync';$('#syncState').classList.add('online');ensureInitialPage()});
pageOrder.observe(()=>{ensureInitialPage();queueRenderPages()});
ydoc.on('update',()=>queueRenderPages());
setTimeout(ensureInitialPage,900);renderPeers();

function openNewRoom(){const key=randomKey(),u=new URL(location.href);u.hash=key;u.search='';window.open(u.toString(),'_blank','noopener')}
$('#newRoom').onclick=openNewRoom;
function showShare(){const link=location.href;$('#shareLink').value=link;const q=$('#qr');q.replaceChildren();if(window.QRCode)new QRCode(q,{text:link,width:192,height:192,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});else q.textContent=room;$('#shareModal').hidden=false;$('#copyLink').focus()}
function hideShare(){$('#shareModal').hidden=true}
$('#shareRoom').onclick=showShare;$('#shareClose').onclick=hideShare;$('#shareModal').addEventListener('pointerdown',e=>{if(e.target===$('#shareModal'))hideShare()});
$('#copyLink').onclick=async()=>{try{await navigator.clipboard.writeText($('#shareLink').value);$('#copyLink').textContent='COPIED';setTimeout(()=>$('#copyLink').textContent='COPY',1000)}catch(_){$('#shareLink').select();document.execCommand('copy')}};
window.addEventListener('keydown',e=>{if(e.key==='Escape')hideShare()});

const tooltip=$('#tooltip');let tipTimer=0;
document.addEventListener('pointerover',e=>{const t=e.target.closest?.('[data-tip]');if(!t)return;clearTimeout(tipTimer);tipTimer=setTimeout(()=>{tooltip.textContent=t.dataset.tip;const r=t.getBoundingClientRect();tooltip.style.left=Math.max(6,Math.min(innerWidth-tooltip.offsetWidth-6,r.left+r.width/2-tooltip.offsetWidth/2))+'px';tooltip.style.top=(r.bottom+7)+'px';tooltip.classList.add('show')},300)});document.addEventListener('pointerout',e=>{if(e.target.closest?.('[data-tip]')){clearTimeout(tipTimer);tooltip.classList.remove('show')}});
window.addEventListener('resize',refreshRemoteCursors,{passive:true});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshRemoteCursors();else if(cursorRaf){cancelAnimationFrame(cursorRaf);cursorRaf=0}});
window.addEventListener('beforeunload',()=>{awareness.setLocalStateField('mouse',null);provider.destroy();persistence.destroy()});
</script>
</body>
</html>
